<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Bubbles - Realistic Bubble Animation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 18px;
        z-index: 10;
      }

      #loading.hidden {
        display: none;
      }

      .controls {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 20px;
        border-radius: 12px;
        color: white;
        width: 280px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(139, 92, 246, 0.3);
        z-index: 1000;
      }

      .controls h3 {
        margin: 0 0 15px 0;
        color: #8b5cf6;
        font-size: 16px;
        text-align: center;
      }

      .control-group {
        margin-bottom: 15px;
      }

      .control-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        color: #aaa;
      }

      .control-group input[type="range"] {
        width: 100%;
        height: 4px;
        background: #333;
        outline: none;
        -webkit-appearance: none;
      }

      .control-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #8b5cf6;
        cursor: pointer;
      }

      .control-group input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #8b5cf6;
        cursor: pointer;
        border: none;
      }

      .control-group span {
        display: block;
        margin-top: 5px;
        color: #8b5cf6;
        font-weight: 600;
        font-size: 13px;
        text-align: right;
      }

      #resetDOF {
        width: 100%;
        padding: 8px;
        background: #8b5cf6;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }

      #resetDOF:hover {
        background: #7c3aed;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading environment map...</div>

    <div class="controls">
      <h3>📷 景深控制器</h3>

      <div class="control-group">
        <label>焦点距离 (Focus) <span style="font-size:10px;color:#666;">相机→焦点</span></label>
        <input
          type="range"
          id="focus"
          min="0"
          max="25"
          step="0.5"
          value="10"
        />
        <span id="focusValue">10.0</span>
        <div style="font-size:10px;color:#666;margin-top:2px;">
          焦点Z位置: <span id="focusZValue" style="color:#8b5cf6;">0.0</span>
        </div>
      </div>

      <div class="control-group">
        <label>光圈大小 (Aperture) <span style="font-size:10px;color:#666;">f值倒数</span></label>
        <input
          type="range"
          id="aperture"
          min="0.00001"
          max="0.005"
          step="0.00001"
          value="0.0001"
        />
        <span id="apertureValue">0.0001</span>
      </div>

      <div class="control-group">
        <label>最大模糊 (Max Blur)</label>
        <input
          type="range"
          id="maxBlur"
          min="0.001"
          max="0.1"
          step="0.001"
          value="0.01"
        />
        <span id="maxBlurValue">0.010</span>
      </div>

      <button id="resetDOF">重置景深</button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
      import SimplexNoise from "./SimplexNoise.js";

      // Create simplex noise instance for vertex deformation
      const simplex = new SimplexNoise();

      // ========== Vertex Shader ==========
      const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vPosition;

        void main() {
          vNormal = normalize(normalMatrix * normal);
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `;

      // ========== Fragment Shader ==========
      const fragmentShader = `
        uniform vec3 uCameraPos;
        uniform samplerCube envMap;
        varying vec3 vNormal;
        varying vec3 vPosition;

        vec3 getThinFilmColor(float cosTheta, float thickness) {
          const float PI = 3.14159265359;
          float opticalPath = 2.0 * 1.33 * thickness * cosTheta;

          float phaseR = (2.0 * PI * opticalPath) / 650.0;
          float phaseG = (2.0 * PI * opticalPath) / 550.0;
          float phaseB = (2.0 * PI * opticalPath) / 450.0;

          vec3 color;
          color.r = pow(0.5 + 0.5 * cos(phaseR), 1.2);
          color.g = pow(0.5 + 0.5 * cos(phaseG), 1.2);
          color.b = pow(0.5 + 0.5 * cos(phaseB), 1.2);

          return color;
        }

        void main() {
          vec3 viewDirection = normalize(uCameraPos - vPosition);
          vec3 normal = normalize(vNormal);
          float NdotV = abs(dot(normal, viewDirection));

          float fresnel = pow(1.0 - NdotV, 1.8);

          // 平滑的厚度变化（移除噪声，避免黑点闪烁）
          float thickness = 350.0 + vNormal.y * 150.0 + vNormal.x * 60.0;
          vec3 iridescence = getThinFilmColor(NdotV, thickness) * 2.2;

          vec3 reflected = reflect(-viewDirection, normal);
          vec3 envColor = textureCube(envMap, reflected).rgb;

          vec3 refracted = refract(-viewDirection, normal, 1.0 / 1.33);
          vec3 refractColor = textureCube(envMap, refracted).rgb;

          float edgeMask = smoothstep(0.2, 0.95, fresnel);
          
          // 减少环境贴图权重，增强彩虹色
          vec3 edgeColor = mix(iridescence, envColor, fresnel * 0.25);
          vec3 centerColor = refractColor * 1.2 + envColor * 0.2;

          vec3 finalColor = mix(centerColor, edgeColor, edgeMask);

          // 增强饱和度和亮度
          float luminance = dot(finalColor, vec3(0.299, 0.587, 0.114));
          finalColor = mix(vec3(luminance), finalColor, 1.8);
          finalColor *= 2.2;
          finalColor += envColor * 0.3;
          
          // 添加轻微的平滑处理，避免闪烁
          finalColor = clamp(finalColor, 0.0, 3.0);

          float alpha = edgeMask * 0.95 + (1.0 - edgeMask) * 0.4;

          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      // ========== Enhanced Fragment Shader for Reference Bubble ==========
      const enhancedFragmentShader = `
        uniform vec3 uCameraPos;
        uniform samplerCube envMap;
        varying vec3 vNormal;
        varying vec3 vPosition;

        vec3 getThinFilmColor(float cosTheta, float thickness) {
          const float PI = 3.14159265359;
          float opticalPath = 2.0 * 1.33 * thickness * cosTheta;

          float phaseR = (2.0 * PI * opticalPath) / 650.0;
          float phaseG = (2.0 * PI * opticalPath) / 550.0;
          float phaseB = (2.0 * PI * opticalPath) / 450.0;

          vec3 color;
          color.r = pow(0.5 + 0.5 * cos(phaseR), 1.2);
          color.g = pow(0.5 + 0.5 * cos(phaseG), 1.2);
          color.b = pow(0.5 + 0.5 * cos(phaseB), 1.2);

          return color;
        }

        void main() {
          vec3 viewDirection = normalize(uCameraPos - vPosition);
          vec3 normal = normalize(vNormal);
          float NdotV = abs(dot(normal, viewDirection));

          float fresnel = pow(1.0 - NdotV, 1.8);

          // Uniform thickness with minimal variation for consistent color band
          float thickness = 400.0 + vNormal.y * 30.0;
          
          // Calculate iridescence
          vec3 iridescence = getThinFilmColor(NdotV, thickness);

          // Show iridescence at edge with wider range
          float iridescenceMask = smoothstep(0.7, 0.98, fresnel);
          
          // Specular highlight (white reflection from directional light)
          vec3 lightDir = normalize(vec3(-2.0, 2.0, 3.0));
          vec3 halfVec = normalize(viewDirection + lightDir);
          float specPower = pow(max(dot(normal, halfVec), 0.0), 128.0);
          vec3 specular = vec3(1.0) * specPower * 10.0;

          // Minimal environment influence
          vec3 reflected = reflect(-viewDirection, normal);
          vec3 envColor = textureCube(envMap, reflected).rgb * 0.1;

          // Final color: iridescence at edge + specular highlight
          vec3 finalColor = iridescence * iridescenceMask * 6.0 + specular + envColor;

          // Enhanced saturation
          float luminance = dot(finalColor, vec3(0.299, 0.587, 0.114));
          finalColor = mix(vec3(luminance), finalColor, 2.2);
          
          // Brightness boost
          finalColor *= 3.5;

          // Balanced transparency: visible edge, transparent center
          float alpha = smoothstep(0.6, 0.98, fresnel) * 0.9 + 0.05;

          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      // ========== Bubble Class ==========
      class Bubble {
        constructor(geometry, baseMaterial, camera) {
          // Random size (0.15 - 0.6) - 包含小气泡
          this.size = 0.15 + Math.random() * 0.45;

          // Clone material for this bubble
          this.material = baseMaterial.clone();
          this.material.uniforms.uCameraPos = { value: camera.position };
          this.material.uniforms.envMap = { value: null };

          // Clone geometry for independent vertex deformation
          this.geometry = geometry.clone();

          // Store original vertex positions for deformation
          const positions = this.geometry.attributes.position;
          this.originalPositions = positions.array.slice();

          // Create mesh
          this.mesh = new THREE.Mesh(this.geometry, this.material);
          this.mesh.scale.setScalar(this.size);

          // Physical properties
          this.speed = 0.3 + Math.random() * 0.5; // 0.3 - 0.8 units/sec
          this.swingAmplitude = 0.5 + Math.random() * 1.0; // 0.5 - 1.5
          this.swingFrequency = 0.5 + Math.random() * 1.5; // 0.5 - 2.0 Hz
          this.rotationSpeed = 0.005 + Math.random() * 0.015; // 0.005 - 0.02
          this.phase = Math.random() * Math.PI * 2; // 0 - 2π

          // Starting position
          this.startX = -4 + Math.random() * 8; // -4 to 4
          this.mesh.position.set(this.startX, -6, 0);

          // Z轴运动参数
          this.zAmplitude = 2 + Math.random() * 5; // 2-7 units
          this.zFrequency = 0.2 + Math.random() * 0.3; // 0.2-0.5 Hz
          this.zPhase = Math.random() * Math.PI * 2;
          this.startZ = -5 + Math.random() * 10; // -5 to 5
          this.mesh.position.z = this.startZ;

          // State
          this.active = true;
        }

        update(deltaTime, elapsedTime) {
          if (!this.active) return;

          // Vertical rise
          this.mesh.position.y += this.speed * deltaTime;

          // Horizontal swing (sine wave)
          this.mesh.position.x =
            this.startX +
            Math.sin(elapsedTime * this.swingFrequency + this.phase) *
              this.swingAmplitude;

          // Z轴前后摆动
          this.mesh.position.z =
            this.startZ +
            Math.sin(elapsedTime * this.zFrequency + this.zPhase) *
              this.zAmplitude;

          // Rotation
          this.mesh.rotation.y += this.rotationSpeed;
          this.mesh.rotation.x += this.rotationSpeed * 0.5;

          // Vertex deformation using Simplex noise
          const positions = this.geometry.attributes.position;
          const time = elapsedTime;

          for (let i = 0; i < positions.count; i++) {
            const x = this.originalPositions[i * 3];
            const y = this.originalPositions[i * 3 + 1];
            const z = this.originalPositions[i * 3 + 2];

            // Generate 3D Simplex noise - 更平滑的变形，减少闪烁
            const noise = simplex.noise3d(
              x * 0.25 + time * 0.08,  // 降低频率使变形更平滑
              y * 0.25 + time * 0.08,
              z * 0.25
            );

            // Map noise from [-1, 1] to [0, 1] then scale
            const normalizedNoise = noise * 0.5 + 0.5; // 0 to 1
            const ratio = normalizedNoise * 0.3 + 0.85; // 0.85 to 1.15 - 更轻柔的变形

            // Apply deformation
            positions.setXYZ(i, x * ratio, y * ratio, z * ratio);
          }

          positions.needsUpdate = true;
          this.geometry.computeVertexNormals();

          // Check if reached top boundary - 重生逻辑
          if (this.mesh.position.y > 6) {
            // 重置到底部
            this.mesh.position.y = -6;
            
            // 随机新的X起始位置
            this.startX = -4 + Math.random() * 8; // -4 to 4
            this.mesh.position.x = this.startX;
            
            // 随机新的Z起始位置
            this.startZ = -5 + Math.random() * 10; // -5 to 5
            this.mesh.position.z = this.startZ;
            
            // 随机新的相位
            this.phase = Math.random() * Math.PI * 2;
            this.zPhase = Math.random() * Math.PI * 2;
            
            // 随机新的速度和摆动参数
            this.speed = 0.3 + Math.random() * 0.5;
            this.swingAmplitude = 0.5 + Math.random() * 1.0;
            this.swingFrequency = 0.5 + Math.random() * 1.5;
            this.zAmplitude = 2 + Math.random() * 5;
            this.zFrequency = 0.2 + Math.random() * 0.3;
          }
        }

        setEnvMap(envMap) {
          this.material.uniforms.envMap.value = envMap;
        }
      }

      // ========== Scene Setup ==========
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 10;

      // Add directional light for reference bubble
      const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
      directionalLight.position.set(-2, 2, 3);
      scene.add(directionalLight);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // ========== 创建后处理合成器 ==========
      const composer = new EffectComposer(renderer);

      // 添加渲染通道
      const renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);

      // 计算设备自适应参数（解决移动端和PC端差异）
      const isMobile = window.innerWidth < 768;
      const screenScale = Math.min(window.innerWidth, window.innerHeight) / 1000;
      
      // 添加景深通道（自适应参数）
      const bokehPass = new BokehPass(scene, camera, {
        focus: 10.0,
        aperture: 0.0001 * (isMobile ? 1.5 : 1.0), // 移动端增强模糊
        maxblur: 0.01,
        width: window.innerWidth,
        height: window.innerHeight,
      });
      
      // 存储设备信息供调试
      bokehPass.userData = {
        isMobile: isMobile,
        screenScale: screenScale,
        devicePixelRatio: window.devicePixelRatio
      };
      
      composer.addPass(bokehPass);

      // ========== Shared Resources ==========
      const sharedGeometry = new THREE.SphereGeometry(1, 64, 64);

      const baseMaterial = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: {
          uCameraPos: { value: camera.position },
          envMap: { value: null },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      // ========== Create Bubbles ==========
      const bubbles = [];
      for (let i = 0; i < 15; i++) {  // 6 → 15
        const bubble = new Bubble(sharedGeometry, baseMaterial, camera);
        bubbles.push(bubble);
        scene.add(bubble.mesh);
      }

      // ========== Create Reference Bubble (Enhanced Style) - HIDDEN ==========
      // 参考球体已隐藏
      const referenceMaterial = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: enhancedFragmentShader,
        uniforms: {
          uCameraPos: { value: camera.position },
          envMap: { value: null },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      const referenceBubbleGeometry = new THREE.SphereGeometry(1.8, 64, 64);
      const referenceBubble = new THREE.Mesh(
        referenceBubbleGeometry,
        referenceMaterial
      );
      referenceBubble.position.set(-3, 0, 0); // Left side, center height
      referenceBubble.visible = false; // 隐藏参考球体
      scene.add(referenceBubble);

      // ========== Load HDR Environment ==========
      const loadingDiv = document.getElementById("loading");
      const rgbeLoader = new RGBELoader();

      rgbeLoader.load(
        "./little_paris_eiffel_tower_1k.hdr",
        (texture) => {
          // Convert to CubeMap format
          const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256);
          cubeRenderTarget.fromEquirectangularTexture(renderer, texture);

          const envMap = cubeRenderTarget.texture;

          // Set environment map for all bubbles
          bubbles.forEach((bubble) => {
            bubble.setEnvMap(envMap);
          });

          // Set environment map for reference bubble
          referenceMaterial.uniforms.envMap.value = envMap;

          // Clean up
          texture.dispose();

          // Hide loading indicator
          loadingDiv.classList.add("hidden");

          console.log("✅ Environment map loaded successfully!");
        },
        undefined,
        (error) => {
          console.error("❌ HDR loading failed:", error);
          loadingDiv.textContent = "Error loading environment map";
        }
      );

      // ========== 景深控制器事件监听 ==========
      document.getElementById("focus").addEventListener("input", (e) => {
        const value = parseFloat(e.target.value);
        bokehPass.uniforms.focus.value = value;
        document.getElementById("focusValue").textContent = value.toFixed(1);
        
        // 计算并显示焦点的实际Z位置（相机在Z=10）
        const focusZ = 10 - value;
        document.getElementById("focusZValue").textContent = focusZ.toFixed(1);
      });

      document.getElementById("aperture").addEventListener("input", (e) => {
        const value = parseFloat(e.target.value);
        bokehPass.uniforms.aperture.value = value;
        document.getElementById("apertureValue").textContent = value.toFixed(5);
      });

      document.getElementById("maxBlur").addEventListener("input", (e) => {
        const value = parseFloat(e.target.value);
        bokehPass.uniforms.maxblur.value = value;
        document.getElementById("maxBlurValue").textContent = value.toFixed(3);
      });

      document.getElementById("resetDOF").addEventListener("click", () => {
        bokehPass.uniforms.focus.value = 10.0;
        bokehPass.uniforms.aperture.value = 0.0001;
        bokehPass.uniforms.maxblur.value = 0.01;
        document.getElementById("focus").value = 10;
        document.getElementById("aperture").value = 0.0001;
        document.getElementById("maxBlur").value = 0.01;
        document.getElementById("focusValue").textContent = "10.0";
        document.getElementById("focusZValue").textContent = "0.0";
        document.getElementById("apertureValue").textContent = "0.0001";
        document.getElementById("maxBlurValue").textContent = "0.010";
      });
      
      // 初始化焦点Z位置显示
      document.getElementById("focusZValue").textContent = "0.0";

      // ========== Animation Loop ==========
      const clock = new THREE.Clock();
      let elapsedTime = 0;

      function animate() {
        requestAnimationFrame(animate);

        const deltaTime = clock.getDelta();
        elapsedTime += deltaTime;

        // Update all bubbles
        bubbles.forEach((bubble) => {
          bubble.update(deltaTime, elapsedTime);
        });

        // Slowly rotate reference bubble
        referenceBubble.rotation.y += 0.003;
        referenceBubble.rotation.x = Math.sin(elapsedTime * 0.3) * 0.1;

        composer.render();
      }

      animate();

      // ========== Handle Window Resize ==========
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      // ========== Console Info ==========
      console.log(
        "%c🎈 Rising Bubbles Animation with DOF",
        "color: #00d9ff; font-size: 20px; font-weight: bold;"
      );
      console.log("%cBubble count: 15", "color: #a855f7; font-size: 14px;");
      console.log(
        "%cSize range: 0.15 - 0.6",
        "color: #a855f7; font-size: 14px;"
      );
      console.log(
        "%cZ-axis range: -12 to 12 (with motion)",
        "color: #a855f7; font-size: 14px;"
      );
      console.log(
        "%cCamera Z: 10 | Focus range: 0-25",
        "color: #a855f7; font-size: 14px;"
      );
      console.log(
        "%c📱 Device Info:",
        "color: #f59e0b; font-size: 14px; font-weight: bold;"
      );
      console.log(
        `%c  • Screen: ${window.innerWidth}x${window.innerHeight}`,
        "color: #10b981; font-size: 12px;"
      );
      console.log(
        `%c  • Device Type: ${isMobile ? "Mobile" : "Desktop"}`,
        "color: #10b981; font-size: 12px;"
      );
      console.log(
        `%c  • Pixel Ratio: ${window.devicePixelRatio}`,
        "color: #10b981; font-size: 12px;"
      );
      console.log(
        `%c  • Aperture Scale: ${isMobile ? "1.5x" : "1.0x"}`,
        "color: #10b981; font-size: 12px;"
      );
    </script>
  </body>
</html>
