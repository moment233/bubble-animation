<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deformed Bubble - Organic Shape</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 18px;
        z-index: 10;
        text-align: center;
      }

      #loading.hidden {
        display: none;
      }

      #info {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        z-index: 10;
      }

      #controls {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 10px;
        color: #fff;
        font-size: 14px;
        z-index: 10;
      }

      .control-group {
        margin-bottom: 15px;
      }

      .control-group label {
        display: block;
        margin-bottom: 5px;
        color: #00d9ff;
      }

      .control-group input[type="range"] {
        width: 200px;
      }

      .control-group span {
        margin-left: 10px;
        color: #a855f7;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading environment map...</div>
    <div id="info">🫧 Deformed Bubble - Vertex Displacement</div>

    <div id="controls">
      <h3 style="margin-bottom: 15px; color: #00d9ff">形变控制</h3>

      <div class="control-group">
        <label>变形强度 (Deformation)</label>
        <input
          type="range"
          id="deformStrength"
          min="0"
          max="1"
          step="0.01"
          value="0.3"
        />
        <span id="deformValue">0.3</span>
      </div>

      <div class="control-group">
        <label>噪声频率 (Noise Scale)</label>
        <input
          type="range"
          id="noiseScale"
          min="0.5"
          max="5"
          step="0.1"
          value="2.0"
        />
        <span id="noiseValue">2.0</span>
      </div>

      <div class="control-group">
        <label>动画速度 (Animation Speed)</label>
        <input
          type="range"
          id="animSpeed"
          min="0"
          max="2"
          step="0.1"
          value="0.3"
        />
        <span id="speedValue">0.3</span>
      </div>

      <div class="control-group">
        <label>扭曲强度 (Twist)</label>
        <input
          type="range"
          id="twistAmount"
          min="0"
          max="3"
          step="0.1"
          value="1.5"
        />
        <span id="twistValue">1.5</span>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

      // ========== Vertex Shader - 关键：顶点位移 ==========
      const vertexShader = `
        uniform float uTime;
        uniform float uDeformStrength;
        uniform float uNoiseScale;
        uniform float uTwistAmount;

        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vWorldPosition;
        varying vec3 vOriginalPosition;

        // ===== 3D Simplex 噪声函数 =====
        // 用于生成平滑的随机变形
        vec3 mod289(vec3 x) {
          return x - floor(x * (1.0 / 289.0)) * 289.0;
        }

        vec4 mod289(vec4 x) {
          return x - floor(x * (1.0 / 289.0)) * 289.0;
        }

        vec4 permute(vec4 x) {
          return mod289(((x * 34.0) + 1.0) * x);
        }

        vec4 taylorInvSqrt(vec4 r) {
          return 1.79284291400159 - 0.85373472095314 * r;
        }

        float snoise(vec3 v) {
          const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

          vec3 i  = floor(v + dot(v, C.yyy));
          vec3 x0 = v - i + dot(i, C.xxx);

          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min(g.xyz, l.zxy);
          vec3 i2 = max(g.xyz, l.zxy);

          vec3 x1 = x0 - i1 + C.xxx;
          vec3 x2 = x0 - i2 + C.yyy;
          vec3 x3 = x0 - D.yyy;

          i = mod289(i);
          vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                  + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                  + i.x + vec4(0.0, i1.x, i2.x, 1.0));

          float n_ = 0.142857142857;
          vec3 ns = n_ * D.wyz - D.xzx;

          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_);

          vec4 x = x_ * ns.x + ns.yyyy;
          vec4 y = y_ * ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);

          vec4 b0 = vec4(x.xy, y.xy);
          vec4 b1 = vec4(x.zw, y.zw);

          vec4 s0 = floor(b0) * 2.0 + 1.0;
          vec4 s1 = floor(b1) * 2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));

          vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
          vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

          vec3 p0 = vec3(a0.xy, h.x);
          vec3 p1 = vec3(a0.zw, h.y);
          vec3 p2 = vec3(a1.xy, h.z);
          vec3 p3 = vec3(a1.zw, h.w);

          vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
          p0 *= norm.x;
          p1 *= norm.y;
          p2 *= norm.z;
          p3 *= norm.w;

          vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
          m = m * m;
          return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
        }

        // ===== 分形布朗运动（FBM）- 多层噪声叠加 =====
        float fbm(vec3 p) {
          float value = 0.0;
          float amplitude = 0.5;
          float frequency = 1.0;
          
          // 4层噪声叠加，创建复杂的变形
          for (int i = 0; i < 4; i++) {
            value += amplitude * snoise(p * frequency);
            frequency *= 2.0;
            amplitude *= 0.5;
          }
          
          return value;
        }

        void main() {
          vOriginalPosition = position;
          
          // ===== 1. 基础噪声变形 =====
          vec3 noisePos = position * uNoiseScale + vec3(uTime * 0.2);
          float noise1 = fbm(noisePos);
          
          // ===== 2. 添加第二层噪声（不同频率） =====
          vec3 noisePos2 = position * uNoiseScale * 1.5 - vec3(uTime * 0.15);
          float noise2 = fbm(noisePos2);
          
          // ===== 3. 扭曲变形（创建8字形效果） =====
          float twistAngle = position.y * uTwistAmount + uTime * 0.3;
          float twistNoise = snoise(vec3(position.y * 2.0, uTime * 0.1, 0.0));
          
          // 8字形扭曲
          vec3 twisted = position;
          float cosAngle = cos(twistAngle + twistNoise);
          float sinAngle = sin(twistAngle + twistNoise);
          twisted.x = position.x * cosAngle - position.z * sinAngle;
          twisted.z = position.x * sinAngle + position.z * cosAngle;
          
          // ===== 4. 挤压变形（中间细，两端粗） =====
          float squeezeNoise = snoise(vec3(0.0, position.y * 3.0, uTime * 0.2));
          float squeeze = 1.0 + squeezeNoise * 0.3;
          
          // Y轴方向的挤压
          float yFactor = abs(position.y);
          squeeze *= (1.0 - yFactor * 0.3); // 中间更细
          
          twisted.x *= squeeze;
          twisted.z *= squeeze;
          
          // ===== 5. 沿法线方向的位移 =====
          vec3 displacedNormal = normal;
          float normalDisplacement = (noise1 + noise2 * 0.5) * uDeformStrength;
          
          // ===== 6. 组合所有变形 =====
          vec3 finalPosition = twisted + displacedNormal * normalDisplacement;
          
          // ===== 7. 计算变形后的法线 =====
          // 通过有限差分法计算新法线
          float offset = 0.01;
          vec3 tangent1 = vec3(
            fbm((position + vec3(offset, 0.0, 0.0)) * uNoiseScale),
            0.0,
            fbm((position + vec3(0.0, 0.0, offset)) * uNoiseScale)
          );
          vec3 tangent2 = vec3(
            0.0,
            fbm((position + vec3(0.0, offset, 0.0)) * uNoiseScale),
            fbm((position + vec3(0.0, 0.0, offset)) * uNoiseScale)
          );
          vec3 deformedNormal = normalize(cross(tangent1, tangent2));
          
          vNormal = normalize(normalMatrix * mix(normal, deformedNormal, uDeformStrength));
          vPosition = finalPosition;
          
          vec4 worldPosition = modelMatrix * vec4(finalPosition, 1.0);
          vWorldPosition = worldPosition.xyz;
          
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `;

      // ========== Fragment Shader - 与之前相同 ==========
      const fragmentShader = `
        uniform vec3 uCameraPos;
        uniform samplerCube envMap;
        uniform float uTime;
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vWorldPosition;
        varying vec3 vOriginalPosition;

        // 简化版噪声（用于厚度变化）
        float noise(vec3 p) {
          vec3 i = floor(p);
          vec3 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          
          float n = i.x + i.y * 57.0 + i.z * 113.0;
          return mix(
            mix(
              mix(fract(sin(n) * 43758.5453), fract(sin(n + 1.0) * 43758.5453), f.x),
              mix(fract(sin(n + 57.0) * 43758.5453), fract(sin(n + 58.0) * 43758.5453), f.x),
              f.y
            ),
            mix(
              mix(fract(sin(n + 113.0) * 43758.5453), fract(sin(n + 114.0) * 43758.5453), f.x),
              mix(fract(sin(n + 170.0) * 43758.5453), fract(sin(n + 171.0) * 43758.5453), f.x),
              f.y
            ),
            f.z
          );
        }

        float fbm(vec3 p) {
          float value = 0.0;
          float amplitude = 0.5;
          float frequency = 1.0;
          
          for (int i = 0; i < 4; i++) {
            value += amplitude * noise(p * frequency);
            frequency *= 2.0;
            amplitude *= 0.5;
          }
          
          return value;
        }

        // 薄膜干涉颜色
        vec3 getThinFilmColor(float cosTheta, float thickness) {
          const float PI = 3.14159265359;
          const float n = 1.33;
          
          float opticalPath = 2.0 * n * thickness * cosTheta;
          
          float phaseR = (2.0 * PI * opticalPath) / 650.0;
          float phaseG = (2.0 * PI * opticalPath) / 550.0;
          float phaseB = (2.0 * PI * opticalPath) / 450.0;
          
          float intensityR = pow(0.5 + 0.5 * cos(phaseR), 1.3);
          float intensityG = pow(0.5 + 0.5 * cos(phaseG), 1.3);
          float intensityB = pow(0.5 + 0.5 * cos(phaseB), 1.3);
          
          return vec3(intensityR, intensityG, intensityB);
        }

        void main() {
          vec3 viewDirection = normalize(uCameraPos - vWorldPosition);
          vec3 normal = normalize(vNormal);
          float NdotV = abs(dot(normal, viewDirection));
          
          // 菲涅尔效果
          float fresnel = pow(1.0 - NdotV, 1.8);
          
          // 薄膜厚度变化
          float baseThickness = 350.0;
          float angleVariation = vOriginalPosition.y * 250.0;
          
          float noiseScale = 2.5;
          float noise1 = fbm(vOriginalPosition * noiseScale + uTime * 0.02);
          float noise2 = fbm(vOriginalPosition * noiseScale * 2.0 - uTime * 0.03);
          float noisePattern = noise1 * 150.0 + noise2 * 80.0;
          
          float thickness = baseThickness + angleVariation + noisePattern;
          thickness = clamp(thickness, 200.0, 700.0);
          
          // 薄膜干涉颜色
          vec3 iridescence = getThinFilmColor(NdotV, thickness);
          
          float luminance = dot(iridescence, vec3(0.299, 0.587, 0.114));
          iridescence = mix(vec3(luminance), iridescence, 2.0);
          iridescence *= 2.5;
          
          // 环境反射和折射
          vec3 reflected = reflect(-viewDirection, normal);
          vec3 envColor = textureCube(envMap, reflected).rgb;
          
          vec3 refracted = refract(-viewDirection, normal, 1.0 / 1.33);
          vec3 refractColor = vec3(0.0);
          if (length(refracted) > 0.01) {
            refractColor = textureCube(envMap, refracted).rgb;
          }
          
          // 边缘遮罩
          float edgeMask = smoothstep(0.15, 0.95, fresnel);
          
          // 颜色混合
          vec3 edgeColor = mix(iridescence, envColor, fresnel * 0.2);
          vec3 centerColor = refractColor * 1.5 + iridescence * 0.3 + envColor * 0.1;
          vec3 finalColor = mix(centerColor, edgeColor, edgeMask);
          
          finalColor *= 1.8;
          finalColor += envColor * 0.15;
          
          // 透明度
          float alpha = edgeMask * 0.95 + (1.0 - edgeMask) * 0.25;
          
          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      // ========== Scene Setup ==========
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 4;

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // ========== Create Deformed Bubble ==========
      const geometry = new THREE.SphereGeometry(1, 128, 128);

      const material = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: {
          uCameraPos: { value: camera.position },
          envMap: { value: null },
          uTime: { value: 0 },
          uDeformStrength: { value: 0.3 },
          uNoiseScale: { value: 2.0 },
          uTwistAmount: { value: 1.5 },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      const bubble = new THREE.Mesh(geometry, material);
      scene.add(bubble);

      // ========== Controls ==========
      const deformSlider = document.getElementById("deformStrength");
      const deformValue = document.getElementById("deformValue");
      const noiseSlider = document.getElementById("noiseScale");
      const noiseValue = document.getElementById("noiseValue");
      const speedSlider = document.getElementById("animSpeed");
      const speedValue = document.getElementById("speedValue");
      const twistSlider = document.getElementById("twistAmount");
      const twistValue = document.getElementById("twistValue");

      let animSpeed = 0.3;

      deformSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.uDeformStrength.value = val;
        deformValue.textContent = val.toFixed(2);
      });

      noiseSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.uNoiseScale.value = val;
        noiseValue.textContent = val.toFixed(1);
      });

      speedSlider.addEventListener("input", (e) => {
        animSpeed = parseFloat(e.target.value);
        speedValue.textContent = animSpeed.toFixed(1);
      });

      twistSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.uTwistAmount.value = val;
        twistValue.textContent = val.toFixed(1);
      });

      // ========== Load HDR Environment ==========
      const loadingDiv = document.getElementById("loading");
      const rgbeLoader = new RGBELoader();

      rgbeLoader.load(
        "./studio_small_08_1k.hdr",
        (texture) => {
          const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512);
          cubeRenderTarget.fromEquirectangularTexture(renderer, texture);

          const envMap = cubeRenderTarget.texture;
          material.uniforms.envMap.value = envMap;

          texture.dispose();
          loadingDiv.classList.add("hidden");

          console.log("✅ Environment map loaded!");
        },
        undefined,
        (error) => {
          console.error("❌ HDR loading failed:", error);
          loadingDiv.textContent = "Error loading environment map";
        }
      );

      // ========== Animation Loop ==========
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const elapsedTime = clock.getElapsedTime();

        // 缓慢旋转
        bubble.rotation.y = elapsedTime * 0.1;
        bubble.rotation.x = Math.sin(elapsedTime * 0.05) * 0.1;

        // 更新时间 uniform
        material.uniforms.uTime.value = elapsedTime * animSpeed;

        renderer.render(scene, camera);
      }

      animate();

      // ========== Handle Window Resize ==========
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      // ========== Console Info ==========
      console.log(
        "%c🫧 Deformed Bubble - Organic Shape",
        "color: #00d9ff; font-size: 20px; font-weight: bold;"
      );
      console.log(
        "%c使用顶点位移技术创建不规则气泡形状",
        "color: #a855f7; font-size: 14px;"
      );
    </script>
  </body>
</html>
