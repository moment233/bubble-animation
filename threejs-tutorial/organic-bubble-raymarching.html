<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peanut Bubble - Ray Marching SDF</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 18px;
        z-index: 10;
        text-align: center;
      }

      #loading.hidden {
        display: none;
      }

      #info {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        z-index: 10;
        line-height: 1.6;
      }

      #controls {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        color: #fff;
        font-size: 13px;
        z-index: 10;
        max-width: 280px;
      }

      .control-group {
        margin-bottom: 12px;
      }

      .control-group label {
        display: block;
        margin-bottom: 5px;
        color: #00d9ff;
        font-size: 12px;
      }

      .control-group input[type="range"] {
        width: 100%;
      }

      .control-group span {
        margin-left: 10px;
        color: #a855f7;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading environment map...</div>
    <div id="info">
      🫧 Peanut/Gourd Bubble - SDF Ray Marching
      <br />
      葫芦形气泡 - 两个球体平滑融合
    </div>

    <div id="controls">
      <h3 style="margin-bottom: 12px; color: #00d9ff; font-size: 16px">
        形状控制
      </h3>

      <div class="control-group">
        <label>腰部收缩 (Waist Squeeze)</label>
        <input
          type="range"
          id="waistSqueeze"
          min="0"
          max="0.8"
          step="0.01"
          value="0"
        />
        <span id="waistValue">0.00</span>
      </div>

      <div class="control-group">
        <label>拉伸长度 (Stretch)</label>
        <input
          type="range"
          id="stretch"
          min="0.8"
          max="2.5"
          step="0.05"
          value="1.0"
        />
        <span id="stretchValue">1.00</span>
      </div>

      <div class="control-group">
        <label>形变强度 (Deformation)</label>
        <input
          type="range"
          id="deform"
          min="0"
          max="0.5"
          step="0.01"
          value="0.05"
        />
        <span id="deformValue">0.05</span>
      </div>

      <div class="control-group">
        <label>不对称度 (Asymmetry)</label>
        <input
          type="range"
          id="asymmetry"
          min="0"
          max="0.6"
          step="0.01"
          value="0.1"
        />
        <span id="asymmetryValue">0.10</span>
      </div>

      <div class="control-group">
        <label>动画速度 (Speed)</label>
        <input type="range" id="speed" min="0" max="2" step="0.1" value="0.5" />
        <span id="speedValue">0.5</span>
      </div>

      <div class="control-group">
        <label>旋转 (Rotation)</label>
        <input
          type="range"
          id="rotation"
          min="-3.14"
          max="3.14"
          step="0.1"
          value="0.3"
        />
        <span id="rotationValue">0.3</span>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

      // ========== Vertex Shader ==========
      const vertexShader = `
        varying vec2 vUv;
        varying vec3 vPosition;
        varying vec3 vWorldPosition;

        void main() {
          vUv = uv;
          vPosition = position;
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;

      // ========== Fragment Shader - Ray Marching SDF ==========
      const fragmentShader = `
        uniform vec3 uCameraPos;
        uniform samplerCube envMap;
        uniform float uTime;
        uniform float uWaistSqueeze;
        uniform float uStretch;
        uniform float uDeformation;
        uniform float uAsymmetry;
        uniform float uRotation;
        
        varying vec2 vUv;
        varying vec3 vPosition;
        varying vec3 vWorldPosition;

        const int MAX_STEPS = 100;
        const float MAX_DIST = 20.0;
        const float SURF_DIST = 0.001;
        const float PI = 3.14159265359;

        // ===== 3D噪声函数 =====
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

        float snoise(vec3 v) {
          const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

          vec3 i  = floor(v + dot(v, C.yyy));
          vec3 x0 = v - i + dot(i, C.xxx);

          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min(g.xyz, l.zxy);
          vec3 i2 = max(g.xyz, l.zxy);

          vec3 x1 = x0 - i1 + C.xxx;
          vec3 x2 = x0 - i2 + C.yyy;
          vec3 x3 = x0 - D.yyy;

          i = mod289(i);
          vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                  + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                  + i.x + vec4(0.0, i1.x, i2.x, 1.0));

          float n_ = 0.142857142857;
          vec3 ns = n_ * D.wyz - D.xzx;

          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_);

          vec4 x = x_ * ns.x + ns.yyyy;
          vec4 y = y_ * ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);

          vec4 b0 = vec4(x.xy, y.xy);
          vec4 b1 = vec4(x.zw, y.zw);

          vec4 s0 = floor(b0) * 2.0 + 1.0;
          vec4 s1 = floor(b1) * 2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));

          vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
          vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

          vec3 p0 = vec3(a0.xy, h.x);
          vec3 p1 = vec3(a0.zw, h.y);
          vec3 p2 = vec3(a1.xy, h.z);
          vec3 p3 = vec3(a1.zw, h.w);

          vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
          p0 *= norm.x;
          p1 *= norm.y;
          p2 *= norm.z;
          p3 *= norm.w;

          vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
          m = m * m;
          return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
        }

        // ===== SDF 原始形状 =====
        float sdSphere(vec3 p, float r) {
          return length(p) - r;
        }

        float sdEllipsoid(vec3 p, vec3 r) {
          float k0 = length(p / r);
          float k1 = length(p / (r * r));
          return k0 * (k0 - 1.0) / k1;
        }

        // 平滑最小值（用于融合形状）
        float smin(float a, float b, float k) {
          float h = max(k - abs(a - b), 0.0) / k;
          return min(a, b) - h * h * k * 0.25;
        }

        // ===== 核心：葫芦形气泡的 SDF =====
        float sdOrganicBubble(vec3 p) {
          // 旋转（用于倾斜）
          float c = cos(uRotation);
          float s = sin(uRotation);
          mat2 rot = mat2(c, -s, s, c);
          p.xz = rot * p.xz;

          // 轻微的X轴倾斜（模拟自然弯曲）
          float tiltAngle = 0.26; // 约15度
          float cosT = cos(tiltAngle);
          float sinT = sin(tiltAngle);
          mat2 tiltRot = mat2(cosT, -sinT, sinT, cosT);
          p.xy = tiltRot * p.xy;

          // 底部大球（主要部分）
          vec3 bottomSpherePos = p - vec3(0.0, -0.5, 0.0);
          float bottomSphere = sdSphere(bottomSpherePos, 0.7);

          // 顶部小球
          vec3 topSpherePos = p - vec3(0.0, 0.8, 0.0);
          float topSphere = sdSphere(topSpherePos, 0.5);

          // 中间连接部分（创建平滑的腰部）
          vec3 middlePos = p - vec3(0.0, 0.15, 0.0);
          float middleSphere = sdSphere(middlePos, 0.45);

          // 平滑融合三个球体（较大的k值产生更平滑的融合）
          float bubble = smin(bottomSphere, middleSphere, 0.45);
          bubble = smin(bubble, topSphere, 0.45);

          // 轻微的不对称变形（非常微小）
          if (uAsymmetry > 0.01) {
            float asymmetryNoise = snoise(vec3(p.y * 1.5, uTime * 0.08, 0.0));
            bubble += asymmetryNoise * uAsymmetry * 0.08;
          }

          // 极少的表面噪声（保持光滑）
          if (uDeformation > 0.01) {
            float surfaceNoise = snoise(p * 4.0 + vec3(uTime * 0.15));
            bubble += surfaceNoise * uDeformation * 0.05;
          }

          return bubble;
        }

        // ===== Ray Marching =====
        float rayMarch(vec3 ro, vec3 rd) {
          float dO = 0.0;
          
          for(int i = 0; i < MAX_STEPS; i++) {
            vec3 p = ro + rd * dO;
            float dS = sdOrganicBubble(p);
            dO += dS;
            if(dO > MAX_DIST || abs(dS) < SURF_DIST) break;
          }
          
          return dO;
        }

        // ===== 计算法线 =====
        vec3 getNormal(vec3 p) {
          float d = sdOrganicBubble(p);
          vec2 e = vec2(0.001, 0.0);
          
          vec3 n = d - vec3(
            sdOrganicBubble(p - e.xyy),
            sdOrganicBubble(p - e.yxy),
            sdOrganicBubble(p - e.yyx)
          );
          
          return normalize(n);
        }

        // ===== 薄膜干涉颜色 =====
        vec3 getThinFilmColor(float cosTheta, float thickness) {
          const float n = 1.33;
          float opticalPath = 2.0 * n * thickness * cosTheta;
          
          // 完整光谱
          float phaseR = (2.0 * PI * opticalPath) / 650.0;
          float phaseO = (2.0 * PI * opticalPath) / 610.0;
          float phaseY = (2.0 * PI * opticalPath) / 580.0;
          float phaseG = (2.0 * PI * opticalPath) / 550.0;
          float phaseC = (2.0 * PI * opticalPath) / 490.0;
          float phaseB = (2.0 * PI * opticalPath) / 450.0;
          float phaseV = (2.0 * PI * opticalPath) / 420.0;
          
          float intensityR = pow(0.5 + 0.5 * cos(phaseR), 1.3);
          float intensityO = pow(0.5 + 0.5 * cos(phaseO), 1.3);
          float intensityY = pow(0.5 + 0.5 * cos(phaseY), 1.3);
          float intensityG = pow(0.5 + 0.5 * cos(phaseG), 1.3);
          float intensityC = pow(0.5 + 0.5 * cos(phaseC), 1.3);
          float intensityB = pow(0.5 + 0.5 * cos(phaseB), 1.3);
          float intensityV = pow(0.5 + 0.5 * cos(phaseV), 1.3);
          
          vec3 color = vec3(0.0);
          color.r = intensityR * 1.0 + intensityO * 0.9 + intensityY * 0.6;
          color.g = intensityY * 0.7 + intensityG * 1.0 + intensityC * 0.8;
          color.b = intensityC * 0.7 + intensityB * 1.0 + intensityV * 0.9;
          
          float maxComponent = max(max(color.r, color.g), color.b);
          if (maxComponent > 0.01) {
            color = color / maxComponent;
          }
          
          return color;
        }

        void main() {
          // Ray setup
          vec3 ro = uCameraPos;
          vec3 rd = normalize(vWorldPosition - uCameraPos);
          
          // Ray marching
          float d = rayMarch(ro, rd);
          
          // 如果没有击中物体，丢弃片段
          if(d > MAX_DIST) {
            discard;
          }
          
          // 击中点
          vec3 p = ro + rd * d;
          vec3 normal = getNormal(p);
          
          // 视线方向
          vec3 viewDir = normalize(uCameraPos - p);
          float NdotV = abs(dot(normal, viewDir));
          
          // 菲涅尔效果
          float fresnel = pow(1.0 - NdotV, 2.0);
          
          // 薄膜厚度变化
          float baseThickness = 350.0;
          
          // 根据位置变化厚度
          float heightVariation = p.y * 200.0;
          
          // 噪声厚度
          float noiseThickness = snoise(p * 2.5 + vec3(uTime * 0.02)) * 120.0;
          noiseThickness += snoise(p * 5.0 - vec3(uTime * 0.03)) * 60.0;
          
          // 基于曲率的厚度变化
          float curvature = length(vec2(p.x, p.z)) / (abs(p.y) + 0.5);
          float curvatureThickness = curvature * 100.0;
          
          float thickness = baseThickness + heightVariation + noiseThickness + curvatureThickness;
          thickness = clamp(thickness, 200.0, 700.0);
          
          // 薄膜干涉颜色
          vec3 iridescence = getThinFilmColor(NdotV, thickness);
          
          // 增强饱和度
          float luminance = dot(iridescence, vec3(0.299, 0.587, 0.114));
          iridescence = mix(vec3(luminance), iridescence, 2.2);
          iridescence *= 2.8;
          
          // 环境反射
          vec3 reflected = reflect(-viewDir, normal);
          vec3 envColor = textureCube(envMap, reflected).rgb;
          
          // 折射
          vec3 refracted = refract(-viewDir, normal, 1.0 / 1.33);
          vec3 refractColor = vec3(0.0);
          if (length(refracted) > 0.01) {
            refractColor = textureCube(envMap, refracted).rgb;
          }
          
          // 边缘遮罩
          float edgeMask = smoothstep(0.1, 0.9, fresnel);
          
          // 颜色混合
          vec3 edgeColor = mix(iridescence * 1.2, envColor, fresnel * 0.15);
          vec3 centerColor = refractColor * 1.3 + iridescence * 0.4 + envColor * 0.1;
          vec3 finalColor = mix(centerColor, edgeColor, edgeMask);
          
          // 整体调整
          finalColor *= 1.9;
          finalColor += envColor * 0.12;
          
          // 透明度
          float alpha = edgeMask * 0.96 + (1.0 - edgeMask) * 0.2;
          
          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      // ========== Scene Setup ==========
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 0, 5);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // ========== Create Plane for Ray Marching ==========
      const geometry = new THREE.PlaneGeometry(6, 6);

      const material = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: {
          uCameraPos: { value: camera.position },
          envMap: { value: null },
          uTime: { value: 0 },
          uWaistSqueeze: { value: 0 },
          uStretch: { value: 1.0 },
          uDeformation: { value: 0.05 },
          uAsymmetry: { value: 0.1 },
          uRotation: { value: 0.3 },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      const plane = new THREE.Mesh(geometry, material);
      scene.add(plane);

      // ========== Controls ==========
      const waistSlider = document.getElementById("waistSqueeze");
      const waistValue = document.getElementById("waistValue");
      const stretchSlider = document.getElementById("stretch");
      const stretchValue = document.getElementById("stretchValue");
      const deformSlider = document.getElementById("deform");
      const deformValue = document.getElementById("deformValue");
      const asymmetrySlider = document.getElementById("asymmetry");
      const asymmetryValue = document.getElementById("asymmetryValue");
      const speedSlider = document.getElementById("speed");
      const speedValue = document.getElementById("speedValue");
      const rotationSlider = document.getElementById("rotation");
      const rotationValue = document.getElementById("rotationValue");

      let animSpeed = 0.5;

      waistSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.uWaistSqueeze.value = val;
        waistValue.textContent = val.toFixed(2);
      });

      stretchSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.uStretch.value = val;
        stretchValue.textContent = val.toFixed(2);
      });

      deformSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.uDeformation.value = val;
        deformValue.textContent = val.toFixed(2);
      });

      asymmetrySlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.uAsymmetry.value = val;
        asymmetryValue.textContent = val.toFixed(2);
      });

      speedSlider.addEventListener("input", (e) => {
        animSpeed = parseFloat(e.target.value);
        speedValue.textContent = animSpeed.toFixed(1);
      });

      rotationSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        material.uniforms.uRotation.value = val;
        rotationValue.textContent = val.toFixed(1);
      });

      // ========== Load HDR Environment ==========
      const loadingDiv = document.getElementById("loading");
      const rgbeLoader = new RGBELoader();

      rgbeLoader.load(
        "./studio_small_08_1k.hdr",
        (texture) => {
          const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512);
          cubeRenderTarget.fromEquirectangularTexture(renderer, texture);

          const envMap = cubeRenderTarget.texture;
          material.uniforms.envMap.value = envMap;

          texture.dispose();
          loadingDiv.classList.add("hidden");

          console.log("✅ Environment map loaded!");
        },
        undefined,
        (error) => {
          console.error("❌ HDR loading failed:", error);
          loadingDiv.textContent = "Error loading environment map";
        }
      );

      // ========== Animation Loop ==========
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const elapsedTime = clock.getElapsedTime();

        // 更新时间
        material.uniforms.uTime.value = elapsedTime * animSpeed;

        // 更新相机位置
        material.uniforms.uCameraPos.value.copy(camera.position);

        renderer.render(scene, camera);
      }

      animate();

      // ========== Mouse Control ==========
      let mouseX = 0;
      let mouseY = 0;
      let targetX = 0;
      let targetY = 0;

      document.addEventListener("mousemove", (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      });

      function updateCamera() {
        targetX = mouseX * 2;
        targetY = mouseY * 2;

        camera.position.x += (targetX - camera.position.x) * 0.05;
        camera.position.y += (targetY - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        requestAnimationFrame(updateCamera);
      }
      updateCamera();

      // ========== Handle Window Resize ==========
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      // ========== Console Info ==========
      console.log(
        "%c🫧 Peanut/Gourd Bubble - SDF Ray Marching",
        "color: #00d9ff; font-size: 20px; font-weight: bold;"
      );
      console.log(
        "%c葫芦形气泡：底部大球(r=0.7) + 顶部小球(r=0.5) + 中间连接",
        "color: #a855f7; font-size: 14px;"
      );
      console.log(
        "%c三个球体通过smin函数平滑融合，创建自然的葫芦形状",
        "color: #10b981; font-size: 14px;"
      );
    </script>
  </body>
</html>
