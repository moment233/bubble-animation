<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeshPhysicalMaterial 气泡 - 官方物理材质 + onBeforeCompile</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }
      .info {
        position: fixed;
        top: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.6);
        padding: 15px 20px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.6;
        max-width: 400px;
        z-index: 10;
      }
      .info h3 {
        margin: 0 0 10px 0;
        font-size: 16px;
        color: #4fc3f7;
      }
      .info ul {
        list-style: none;
        padding: 0;
      }
      .info li {
        margin: 5px 0;
      }
      .info .key {
        display: inline-block;
        background: rgba(79, 195, 247, 0.2);
        padding: 2px 8px;
        border-radius: 3px;
        margin-right: 5px;
        font-family: monospace;
      }
      .controls {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        color: white;
        font-size: 13px;
        z-index: 10;
        min-width: 250px;
      }
      .controls h4 {
        margin: 0 0 10px 0;
        font-size: 14px;
        color: #4fc3f7;
      }
      .control-group {
        margin: 10px 0;
      }
      .control-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        color: #aaa;
      }
      .control-group input[type="range"] {
        width: 100%;
      }
      .control-group .value {
        float: right;
        color: #4fc3f7;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>

    <div class="info">
      <h3>🫧 MeshPhysicalMaterial 气泡</h3>
      <ul>
        <li>✨ 使用官方物理材质（transmission + ior）</li>
        <li>🌈 onBeforeCompile 注入薄膜干涉效果</li>
        <li>🎨 保留真实的反射和折射特性</li>
        <li>👆 点击气泡可破裂</li>
      </ul>
    </div>

    <div class="controls">
      <h4>⚙️ 材质参数调节</h4>

      <div class="control-group">
        <label>
          Transmission
          <span class="value" id="transmission-value">1.00</span>
        </label>
        <input
          type="range"
          id="transmission"
          min="0"
          max="1"
          step="0.01"
          value="1.0"
        />
      </div>

      <div class="control-group">
        <label>
          Thickness
          <span class="value" id="thickness-value">0.50</span>
        </label>
        <input
          type="range"
          id="thickness"
          min="0"
          max="2"
          step="0.05"
          value="0.5"
        />
      </div>

      <div class="control-group">
        <label>
          IOR (折射率)
          <span class="value" id="ior-value">1.33</span>
        </label>
        <input
          type="range"
          id="ior"
          min="1.0"
          max="2.0"
          step="0.01"
          value="1.33"
        />
      </div>

      <div class="control-group">
        <label>
          Clearcoat
          <span class="value" id="clearcoat-value">0.30</span>
        </label>
        <input
          type="range"
          id="clearcoat"
          min="0"
          max="1"
          step="0.05"
          value="0.3"
        />
      </div>

      <div class="control-group">
        <label>
          Iridescence Strength
          <span class="value" id="iridescence-value">0.80</span>
        </label>
        <input
          type="range"
          id="iridescence"
          min="0"
          max="2"
          step="0.1"
          value="0.8"
        />
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RGBELoader } from "three/examples/jsm/loaders/RGBELoader.js";
      import SimplexNoise from "./SimplexNoise.js";

      const canvas = document.querySelector("#webgl");

      // 场景设置
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const sizes = {
        width: window.innerWidth,
        height: window.innerHeight,
      };

      // 相机
      const camera = new THREE.PerspectiveCamera(
        60,
        sizes.width / sizes.height,
        0.1,
        100
      );
      camera.position.z = 30;

      // 渲染器
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
      });
      renderer.setSize(sizes.width, sizes.height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      // 气泡数组
      const bubbles = [];
      const simplex = new SimplexNoise();

      // 全局变量
      let envMapTexture = null;
      let iridescenceStrength = 0.8;

      // 薄膜干涉函数（将被注入到 shader 中）
      const thinFilmShaderCode = `
       // 薄膜干涉颜色计算函数（使用 Three.js 内置的 PI）
       vec3 getThinFilmColor(float cosTheta, float thickness) {
        // 光程差计算
        float opticalPath = 2.0 * 1.33 * thickness * cosTheta;
        
        // 计算可见光谱的主要波长干涉
        float phaseR = (2.0 * PI * opticalPath) / 650.0; // 红光
        float phaseO = (2.0 * PI * opticalPath) / 610.0; // 橙光
        float phaseY = (2.0 * PI * opticalPath) / 580.0; // 黄光
        float phaseG = (2.0 * PI * opticalPath) / 550.0; // 绿光
        float phaseC = (2.0 * PI * opticalPath) / 490.0; // 青光
        float phaseB = (2.0 * PI * opticalPath) / 450.0; // 蓝光
        float phaseV = (2.0 * PI * opticalPath) / 420.0; // 紫光
        
        // 干涉强度
        float intensityR = pow(0.5 + 0.5 * cos(phaseR), 1.2);
        float intensityO = pow(0.5 + 0.5 * cos(phaseO), 1.2);
        float intensityY = pow(0.5 + 0.5 * cos(phaseY), 1.2);
        float intensityG = pow(0.5 + 0.5 * cos(phaseG), 1.2);
        float intensityC = pow(0.5 + 0.5 * cos(phaseC), 1.2);
        float intensityB = pow(0.5 + 0.5 * cos(phaseB), 1.2);
        float intensityV = pow(0.5 + 0.5 * cos(phaseV), 1.2);
        
        // 真实光谱颜色混合
        vec3 color = vec3(0.0);
        color.r = intensityR * 1.0 + intensityO * 0.9 + intensityY * 0.7;
        color.g = intensityY * 0.8 + intensityG * 1.0 + intensityC * 0.9;
        color.b = intensityC * 0.8 + intensityB * 1.0 + intensityV * 0.9;
        
        // 归一化
        color = color / max(max(color.r, color.g), max(color.b, 0.01));
        
        // 增加饱和度
        float luma = dot(color, vec3(0.299, 0.587, 0.114));
        color = mix(vec3(luma), color, 1.8);
        
        return clamp(color, 0.0, 1.0);
      }
     `;

      // 加载 HDR 环境贴图
      const rgbeLoader = new RGBELoader();
      rgbeLoader.load(
        "/abc1.hdr",
        (texture) => {
          texture.mapping = THREE.EquirectangularReflectionMapping;
          scene.environment = texture;
          envMapTexture = texture;

          // 更新所有气泡的环境贴图
          bubbles.forEach((bubble) => {
            bubble.material.envMap = envMapTexture;
            bubble.material.needsUpdate = true;
          });

          console.log("✅ HDR 环境贴图加载成功");
        },
        undefined,
        (error) => {
          console.error("❌ HDR 加载失败:", error);
        }
      );

      // 生成固定位置
      function generateFixedPositions(count) {
        const positions = [];
        const minDistance = 9;
        const maxAttempts = 100;

        for (let i = 0; i < count; i++) {
          let attempts = 0;
          let validPosition = false;
          let newPos;

          while (!validPosition && attempts < maxAttempts) {
            newPos = {
              x: (Math.random() - 0.5) * 30,
              y: (Math.random() - 0.5) * 20,
              z: (Math.random() - 0.5) * 20,
            };

            validPosition = true;
            for (let j = 0; j < positions.length; j++) {
              const dx = newPos.x - positions[j].x;
              const dy = newPos.y - positions[j].y;
              const dz = newPos.z - positions[j].z;
              const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

              if (distance < minDistance) {
                validPosition = false;
                break;
              }
            }

            attempts++;
          }

          positions.push(newPos);
        }

        return positions;
      }

      // 气泡配置
      const bubblesConfig = [
        {
          size: 3.2,
          scale: [1.1, 0.95, 1.0],
          speed: 18,
          spikes: 0.65,
          processing: 2.6,
          offset: 0,
        },
        {
          size: 2.8,
          scale: [0.95, 1.15, 1.0],
          speed: 22,
          spikes: 0.7,
          processing: 2.8,
          offset: 1.5,
        },
        {
          size: 3.5,
          scale: [1.05, 1.05, 1.0],
          speed: 15,
          spikes: 0.6,
          processing: 2.5,
          offset: 3.0,
        },
        {
          size: 2.6,
          scale: [1.15, 0.9, 1.0],
          speed: 20,
          spikes: 0.75,
          processing: 3.0,
          offset: 4.5,
        },
        {
          size: 3.0,
          scale: [2.5, 1.4, 1.0],
          speed: 19,
          spikes: 0.7,
          processing: 2.9,
          offset: 2.0,
        },
        {
          size: 3.3,
          scale: [1.2, 2.3, 1.0],
          speed: 16,
          spikes: 0.65,
          processing: 2.7,
          offset: 3.5,
        },
        {
          size: 2.9,
          scale: [1.9, 1.9, 1.0],
          speed: 21,
          spikes: 0.72,
          processing: 2.8,
          offset: 5.0,
        },
      ];

      const fixedPositions = generateFixedPositions(bubblesConfig.length);

      // 创建气泡（使用 MeshPhysicalMaterial）
      bubblesConfig.forEach((config, index) => {
        const geometry = new THREE.SphereGeometry(config.size, 64, 64);
        const positionAttributeBase = geometry.getAttribute("position").clone();

        // ========== 关键：使用 MeshPhysicalMaterial ==========
        const material = new THREE.MeshPhysicalMaterial({
          transmission: 1.0, // 完全透明（启用体积折射）
          thickness: 0.5, // 气泡薄膜厚度
          roughness: 0.0, // 完全光滑表面
          metalness: 0.0, // 非金属
          ior: 1.33, // 折射率（肥皂泡 / 水）
          envMapIntensity: 1.0, // 环境反射强度
          clearcoat: 0.3, // 清漆层（额外反射）
          clearcoatRoughness: 0.0, // 清漆光滑度
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false,
        });

        // ========== 关键：onBeforeCompile 注入薄膜干涉 ==========
        material.onBeforeCompile = (shader) => {
          // 添加自定义 uniforms
          shader.uniforms.uTime = { value: 0 };
          shader.uniforms.uIridescenceStrength = { value: iridescenceStrength };

          // 在 fragment shader 顶部声明自定义 uniforms
          shader.fragmentShader =
            `
            uniform float uTime;
            uniform float uIridescenceStrength;
          ` + shader.fragmentShader;

          // 注入薄膜干涉函数
          shader.fragmentShader = shader.fragmentShader.replace(
            "void main() {",
            thinFilmShaderCode + "\nvoid main() {"
          );

          // 在最终颜色输出前混合薄膜干涉颜色
          // MeshPhysicalMaterial 在 #include <opaque_fragment> 后输出最终颜色
          shader.fragmentShader = shader.fragmentShader.replace(
            "#include <opaque_fragment>",
            `
          #include <opaque_fragment>
          
          // 计算菲涅尔效果（使用 Three.js 内置变量）
          vec3 viewDir = normalize(vViewPosition);
          vec3 normalView = normalize(vNormal);
          float NdotV = abs(dot(normalView, -viewDir));
          float fresnel = pow(1.0 - NdotV, 1.8);
          
          // 动态厚度（基于法线和时间的简化计算）
          float thickness = 300.0 + vNormal.y * 400.0 
                          + sin(vNormal.x * 2.0 + uTime * 0.5) * 100.0
                          + cos(vNormal.z * 3.0 + uTime * 0.3) * 50.0;
          
          // 计算薄膜干涉颜色
          vec3 iridescence = getThinFilmColor(NdotV, thickness);
          
          // 混合到输出颜色（边缘更强，使用 fresnel 遮罩）
          gl_FragColor.rgb += iridescence * fresnel * uIridescenceStrength;
          `
          );

          // 保存 shader 引用以便后续更新 uniforms
          material.userData.shader = shader;
        };

        const mesh = new THREE.Mesh(geometry, material);

        // 设置位置
        const fixedPos = fixedPositions[index];
        mesh.position.set(fixedPos.x, fixedPos.y, fixedPos.z);

        // 应用非均匀缩放
        mesh.scale.set(config.scale[0], config.scale[1], config.scale[2]);

        scene.add(mesh);

        bubbles.push({
          mesh,
          geometry,
          material,
          positionAttributeBase,
          speed: config.speed,
          spikes: config.spikes,
          processing: config.processing,
          offset: config.offset,
          size: config.size,
          baseScale: [...config.scale],
          fixedPosition: { ...fixedPos },
          state: "floating",
        });
      });

      // 点击事件
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      canvas.addEventListener("click", (event) => {
        mouse.x = (event.clientX / sizes.width) * 2 - 1;
        mouse.y = -(event.clientY / sizes.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const meshes = bubbles
          .filter((b) => b.state !== "bursting")
          .map((b) => b.mesh);
        const intersects = raycaster.intersectObjects(meshes);

        if (intersects.length > 0) {
          const clickedMesh = intersects[0].object;
          const bubble = bubbles.find((b) => b.mesh === clickedMesh);
          if (bubble) {
            burstBubble(bubble);
          }
        }
      });

      // 窗口调整
      window.addEventListener("resize", () => {
        sizes.width = window.innerWidth;
        sizes.height = window.innerHeight;

        camera.aspect = sizes.width / sizes.height;
        camera.updateProjectionMatrix();

        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      // 气泡破裂
      const burstEffects = [];

      function burstBubble(bubble) {
        if (bubble.state === "bursting") return;
        bubble.state = "bursting";

        const shrinkEffect = {
          bubble,
          phase: "shrinking",
          startTime: performance.now(),
          shrinkDuration: 120,
          originalScale: bubble.mesh.scale.clone(),
        };

        burstEffects.push(shrinkEffect);
      }

      function createDroplets(bubble, shrinkPosition) {
        const dropletCount = 5 + Math.floor(Math.random() * 4);
        const droplets = [];

        for (let i = 0; i < dropletCount; i++) {
          const dropletSize = bubble.size * (0.08 + Math.random() * 0.04);
          const dropletGeometry = new THREE.SphereGeometry(dropletSize, 16, 16);
          const dropletMaterial = bubble.material.clone();
          const droplet = new THREE.Mesh(dropletGeometry, dropletMaterial);

          droplet.position.copy(shrinkPosition);
          droplet.scale.set(1, 1, 1);
          scene.add(droplet);

          const angle = (Math.PI * 2 * i) / dropletCount + Math.random() * 0.5;
          const speed = 0.15 + Math.random() * 0.15;

          droplets.push({
            mesh: droplet,
            velocity: new THREE.Vector3(
              Math.cos(angle) * speed,
              Math.sin(angle) * speed * 0.5,
              (Math.random() - 0.5) * 0.05
            ),
            rotation: new THREE.Vector3(
              Math.random() * 0.15,
              Math.random() * 0.15,
              Math.random() * 0.15
            ),
            startTime: performance.now(),
            duration: 350 + Math.random() * 150,
          });
        }

        return droplets;
      }

      function updateBurstEffects(currentTime) {
        for (let i = burstEffects.length - 1; i >= 0; i--) {
          const effect = burstEffects[i];

          if (effect.phase === "shrinking") {
            const elapsed = currentTime - effect.startTime;
            const progress = Math.min(elapsed / effect.shrinkDuration, 1);

            const scale = 1 - progress * 0.95;
            effect.bubble.mesh.scale
              .copy(effect.originalScale)
              .multiplyScalar(scale);
            effect.bubble.mesh.visible = scale > 0.05;

            if (progress >= 1) {
              effect.bubble.mesh.visible = false;
              const droplets = createDroplets(
                effect.bubble,
                effect.bubble.mesh.position
              );

              effect.phase = "droplets";
              effect.droplets = droplets;
              effect.dropletStartTime = currentTime;
            }
          } else if (effect.phase === "droplets") {
            let allComplete = true;

            effect.droplets.forEach((droplet) => {
              const elapsed = currentTime - droplet.startTime;
              const progress = elapsed / droplet.duration;

              if (progress < 1) {
                allComplete = false;

                droplet.mesh.position.add(droplet.velocity);
                droplet.velocity.y -= 0.008;

                droplet.mesh.rotation.x += droplet.rotation.x;
                droplet.mesh.rotation.y += droplet.rotation.y;
                droplet.mesh.rotation.z += droplet.rotation.z;

                const fadeProgress = Math.pow(progress, 1.5);
                const fadeScale = 1 - fadeProgress * 0.7;
                droplet.mesh.scale.setScalar(fadeScale);

                droplet.mesh.visible = fadeScale > 0.1;
              } else {
                scene.remove(droplet.mesh);
                droplet.mesh.geometry.dispose();
                droplet.mesh.material.dispose();
              }
            });

            if (allComplete) {
              burstEffects.splice(i, 1);
            }
          }
        }
      }

      // 更新气泡形变
      const updateBubble = (bubble, time) => {
        const {
          geometry,
          positionAttributeBase,
          speed,
          spikes,
          processing,
          offset,
        } = bubble;
        const vector = new THREE.Vector3();

        const animTime = time * 0.00001 * speed + offset;
        const positionAttribute = geometry.getAttribute("position");

        for (let i = 0; i < positionAttributeBase.count; i++) {
          vector.fromBufferAttribute(positionAttributeBase, i);

          const noise = simplex.noise3d(
            vector.x * spikes,
            vector.y * spikes,
            vector.z * spikes + animTime
          );

          const ratio = noise * (0.05 * processing) + 0.98;
          vector.multiplyScalar(ratio);
          positionAttribute.setXYZ(i, vector.x, vector.y, vector.z);
        }

        geometry.attributes.position.needsUpdate = true;
        geometry.computeVertexNormals();
      };

      // 参数控制
      const transmissionSlider = document.getElementById("transmission");
      const thicknessSlider = document.getElementById("thickness");
      const iorSlider = document.getElementById("ior");
      const clearcoatSlider = document.getElementById("clearcoat");
      const iridescenceSlider = document.getElementById("iridescence");

      transmissionSlider.addEventListener("input", (e) => {
        const value = parseFloat(e.target.value);
        document.getElementById("transmission-value").textContent =
          value.toFixed(2);
        bubbles.forEach((b) => {
          b.material.transmission = value;
        });
      });

      thicknessSlider.addEventListener("input", (e) => {
        const value = parseFloat(e.target.value);
        document.getElementById("thickness-value").textContent =
          value.toFixed(2);
        bubbles.forEach((b) => {
          b.material.thickness = value;
        });
      });

      iorSlider.addEventListener("input", (e) => {
        const value = parseFloat(e.target.value);
        document.getElementById("ior-value").textContent = value.toFixed(2);
        bubbles.forEach((b) => {
          b.material.ior = value;
        });
      });

      clearcoatSlider.addEventListener("input", (e) => {
        const value = parseFloat(e.target.value);
        document.getElementById("clearcoat-value").textContent =
          value.toFixed(2);
        bubbles.forEach((b) => {
          b.material.clearcoat = value;
        });
      });

      iridescenceSlider.addEventListener("input", (e) => {
        const value = parseFloat(e.target.value);
        document.getElementById("iridescence-value").textContent =
          value.toFixed(2);
        iridescenceStrength = value;
        bubbles.forEach((b) => {
          if (b.material.userData.shader) {
            b.material.userData.shader.uniforms.uIridescenceStrength.value =
              value;
          }
        });
      });

      // 动画循环
      const clock = new THREE.Clock();

      const tick = () => {
        const currentTime = performance.now();

        updateBurstEffects(currentTime);

        bubbles.forEach((bubble) => {
          if (bubble.state !== "bursting") {
            // 更新形变
            updateBubble(bubble, currentTime);

            // 更新自定义 uniforms（时间）
            if (bubble.material.userData.shader) {
              bubble.material.userData.shader.uniforms.uTime.value =
                currentTime * 0.001;
            }
          }
        });

        renderer.render(scene, camera);
        window.requestAnimationFrame(tick);
      };

      tick();
    </script>
  </body>
</html>
