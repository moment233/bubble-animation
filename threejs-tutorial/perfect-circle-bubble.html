<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Circle Bubble - Thin Film Interference</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 18px;
        z-index: 10;
        text-align: center;
      }

      #loading.hidden {
        display: none;
      }

      #info {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading environment map...</div>
    <div id="info">Perfect Circle Bubble with Thin Film Interference</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

      // ========== Vertex Shader ==========
      const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vWorldPosition;

        void main() {
          vNormal = normalize(normalMatrix * normal);
          vPosition = position;
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `;

      // ========== Fragment Shader - Enhanced Thin Film Interference ==========
      const fragmentShader = `
        uniform vec3 uCameraPos;
        uniform samplerCube envMap;
        uniform float uTime;
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vWorldPosition;

        // 改进的噪声函数 - 生成更自然的条纹
        float noise(vec3 p) {
          vec3 i = floor(p);
          vec3 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          
          float n = i.x + i.y * 57.0 + i.z * 113.0;
          return mix(
            mix(
              mix(fract(sin(n) * 43758.5453), fract(sin(n + 1.0) * 43758.5453), f.x),
              mix(fract(sin(n + 57.0) * 43758.5453), fract(sin(n + 58.0) * 43758.5453), f.x),
              f.y
            ),
            mix(
              mix(fract(sin(n + 113.0) * 43758.5453), fract(sin(n + 114.0) * 43758.5453), f.x),
              mix(fract(sin(n + 170.0) * 43758.5453), fract(sin(n + 171.0) * 43758.5453), f.x),
              f.y
            ),
            f.z
          );
        }

        // 分形布朗运动 - 创建复杂的厚度变化
        float fbm(vec3 p) {
          float value = 0.0;
          float amplitude = 0.5;
          float frequency = 1.0;
          
          for (int i = 0; i < 4; i++) {
            value += amplitude * noise(p * frequency);
            frequency *= 2.0;
            amplitude *= 0.5;
          }
          
          return value;
        }

        // 物理准确的薄膜干涉颜色计算 - 完整7色光谱
        vec3 getThinFilmColor(float cosTheta, float thickness) {
          const float PI = 3.14159265359;
          const float n = 1.33; // 肥皂泡折射率
          
          // 光程差计算
          float opticalPath = 2.0 * n * thickness * cosTheta;
          
          // 可见光谱的7个主要波长（纳米）
          float phaseR = (2.0 * PI * opticalPath) / 650.0; // 红光
          float phaseO = (2.0 * PI * opticalPath) / 610.0; // 橙光
          float phaseY = (2.0 * PI * opticalPath) / 580.0; // 黄光
          float phaseG = (2.0 * PI * opticalPath) / 550.0; // 绿光
          float phaseC = (2.0 * PI * opticalPath) / 490.0; // 青光
          float phaseB = (2.0 * PI * opticalPath) / 450.0; // 蓝光
          float phaseV = (2.0 * PI * opticalPath) / 420.0; // 紫光
          
          // 干涉强度计算（考虑相位差）
          float intensityR = pow(0.5 + 0.5 * cos(phaseR), 1.3);
          float intensityO = pow(0.5 + 0.5 * cos(phaseO), 1.3);
          float intensityY = pow(0.5 + 0.5 * cos(phaseY), 1.3);
          float intensityG = pow(0.5 + 0.5 * cos(phaseG), 1.3);
          float intensityC = pow(0.5 + 0.5 * cos(phaseC), 1.3);
          float intensityB = pow(0.5 + 0.5 * cos(phaseB), 1.3);
          float intensityV = pow(0.5 + 0.5 * cos(phaseV), 1.3);
          
          // RGB 通道混合 - 基于真实光谱响应
          vec3 color = vec3(0.0);
          
          // 红色通道：红 + 橙 + 部分黄
          color.r = intensityR * 1.0 + intensityO * 0.9 + intensityY * 0.6;
          
          // 绿色通道：黄 + 绿 + 青
          color.g = intensityY * 0.7 + intensityG * 1.0 + intensityC * 0.8;
          
          // 蓝色通道：青 + 蓝 + 紫
          color.b = intensityC * 0.7 + intensityB * 1.0 + intensityV * 0.9;
          
          // 归一化到 [0,1] 范围
          float maxComponent = max(max(color.r, color.g), color.b);
          if (maxComponent > 0.01) {
            color = color / maxComponent;
          }
          
          return color;
        }

        void main() {
          vec3 viewDirection = normalize(uCameraPos - vWorldPosition);
          vec3 normal = normalize(vNormal);
          float NdotV = abs(dot(normal, viewDirection));
          
          // 菲涅尔效果 - 边缘更亮
          float fresnel = pow(1.0 - NdotV, 1.8);
          
          // === 薄膜厚度变化 - 关键参数 ===
          // 基础厚度 (300-600nm 是产生可见光干涉的最佳范围)
          float baseThickness = 350.0;
          
          // 1. 球面角度变化（产生主要的同心圆条纹）
          float angleVariation = vNormal.y * 250.0;
          
          // 2. 多层噪声产生复杂的条纹图案
          float noiseScale = 2.5;
          float noise1 = fbm(vPosition * noiseScale + uTime * 0.02);
          float noise2 = fbm(vPosition * noiseScale * 2.0 - uTime * 0.03);
          float noise3 = fbm(vPosition * noiseScale * 0.5 + vec3(100.0));
          
          // 组合噪声（创建流动的条纹）
          float noisePattern = noise1 * 150.0 + noise2 * 80.0 + noise3 * 50.0;
          
          // 3. 添加位置相关的厚度变化（横向和纵向条纹）
          float positionVariation = sin(vNormal.x * 3.0 + uTime * 0.1) * 40.0 
                                  + cos(vNormal.z * 4.0 - uTime * 0.15) * 30.0;
          
          // 最终厚度
          float thickness = baseThickness + angleVariation + noisePattern + positionVariation;
          
          // 限制厚度范围，避免过度变化
          thickness = clamp(thickness, 200.0, 700.0);
          
          // === 薄膜干涉颜色 ===
          vec3 iridescence = getThinFilmColor(NdotV, thickness);
          
          // 增强饱和度和亮度
          float luminance = dot(iridescence, vec3(0.299, 0.587, 0.114));
          iridescence = mix(vec3(luminance), iridescence, 2.0); // 高饱和度
          iridescence *= 2.5; // 提亮
          
          // === 环境反射和折射 ===
          vec3 reflected = reflect(-viewDirection, normal);
          vec3 envColor = textureCube(envMap, reflected).rgb;
          
          vec3 refracted = refract(-viewDirection, normal, 1.0 / 1.33);
          vec3 refractColor = vec3(0.0);
          if (length(refracted) > 0.01) {
            refractColor = textureCube(envMap, refracted).rgb;
          }
          
          // === 边缘遮罩 ===
          float edgeMask = smoothstep(0.15, 0.95, fresnel);
          
          // === 颜色混合 ===
          // 边缘：薄膜彩虹色主导 + 少量环境反射
          vec3 edgeColor = mix(iridescence, envColor, fresnel * 0.2);
          
          // 中心：折射 + 薄膜色 + 环境光
          vec3 centerColor = refractColor * 1.5 + iridescence * 0.3 + envColor * 0.1;
          
          // 根据边缘遮罩混合
          vec3 finalColor = mix(centerColor, edgeColor, edgeMask);
          
          // 整体亮度调整
          finalColor *= 1.8;
          
          // 添加轻微的环境光提升
          finalColor += envColor * 0.15;
          
          // === 透明度 ===
          // 边缘不透明，中心半透明
          float alpha = edgeMask * 0.95 + (1.0 - edgeMask) * 0.25;
          
          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      // ========== Scene Setup ==========
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 3.5;

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // ========== Create Perfect Sphere Bubble ==========
      // 高精度球体 - 128段确保条纹平滑
      const geometry = new THREE.SphereGeometry(1, 128, 128);

      const material = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: {
          uCameraPos: { value: camera.position },
          envMap: { value: null },
          uTime: { value: 0 },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      const bubble = new THREE.Mesh(geometry, material);
      scene.add(bubble);

      // ========== Load HDR Environment ==========
      const loadingDiv = document.getElementById("loading");
      const rgbeLoader = new RGBELoader();

      rgbeLoader.load(
        "./studio_small_08_1k.hdr",
        (texture) => {
          // Convert to CubeMap format
          const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512);
          cubeRenderTarget.fromEquirectangularTexture(renderer, texture);

          const envMap = cubeRenderTarget.texture;
          material.uniforms.envMap.value = envMap;

          // Clean up
          texture.dispose();

          // Hide loading indicator
          loadingDiv.classList.add("hidden");

          console.log("✅ Environment map loaded successfully!");
        },
        undefined,
        (error) => {
          console.error("❌ HDR loading failed:", error);
          loadingDiv.textContent = "Error loading environment map";
        }
      );

      // ========== Animation Loop ==========
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const elapsedTime = clock.getElapsedTime();

        // 缓慢旋转 - 展示薄膜条纹变化
        bubble.rotation.y = elapsedTime * 0.15; // 慢速旋转
        bubble.rotation.x = Math.sin(elapsedTime * 0.1) * 0.2; // 轻微摆动

        // 更新时间 uniform（用于条纹流动效果）
        material.uniforms.uTime.value = elapsedTime;

        renderer.render(scene, camera);
      }

      animate();

      // ========== Handle Window Resize ==========
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      // ========== Console Info ==========
      console.log(
        "%c🫧 Perfect Circle Bubble with Thin Film Interference",
        "color: #00d9ff; font-size: 20px; font-weight: bold;"
      );
      console.log(
        "%cGeometry: SphereGeometry(1, 128, 128)",
        "color: #a855f7; font-size: 14px;"
      );
      console.log(
        "%cShader: 7-color spectrum interference",
        "color: #a855f7; font-size: 14px;"
      );
      console.log(
        "%cThickness range: 200-700nm",
        "color: #a855f7; font-size: 14px;"
      );
    </script>
  </body>
</html>
