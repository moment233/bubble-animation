<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three-Nebula 彩色粒子喷泉</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #000;
      }
      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }
      .info {
        position: fixed;
        top: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.6);
        padding: 15px 20px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.8;
        z-index: 10;
        backdrop-filter: blur(10px);
      }
      .info h3 {
        margin: 0 0 10px 0;
        font-size: 18px;
        color: #4fc3f7;
      }
      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>

    <div class="info">
      <h3>🎆 Three-Nebula 彩色粒子喷泉</h3>
      <p>✨ 持续发射的彩色粒子流</p>
      <p>🌈 颜色自动变化</p>
      <p>🎨 发射器在轨道上移动</p>
      <p style="color: #4fc3f7; margin-top: 10px">
        ⚡ 使用 three-nebula 粒子库
      </p>
    </div>

    <div class="loading" id="loading">加载中...</div>

    <!-- 方案1: 使用 UMD 版本（全局变量） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-nebula@10.0.3/build/three-nebula.js"></script>

    <script>
      // 移除加载提示
      setTimeout(() => {
        document.getElementById("loading").style.display = "none";
      }, 1000);

      const canvas = document.querySelector("#webgl");

      // 场景设置
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const sizes = {
        width: window.innerWidth,
        height: window.innerHeight,
      };

      // 相机
      const camera = new THREE.PerspectiveCamera(
        60,
        sizes.width / sizes.height,
        1,
        1000
      );
      camera.position.set(0, 0, 300);

      // 渲染器
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
      });
      renderer.setSize(sizes.width, sizes.height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // 检查 three-nebula 是否加载成功
      if (typeof System === "undefined") {
        console.error("❌ three-nebula 加载失败");
        document.getElementById("loading").textContent =
          "❌ 库加载失败，请检查网络";
        throw new Error("three-nebula not loaded");
      }

      console.log("✅ three-nebula 加载成功", System);

      // 全局变量
      let hcolor = 0;
      let tha = 0;
      let ctha = 0;

      // 更新颜色
      const updateColors = (color1, color2, hcolor = 0) => {
        color1.setHSL(hcolor - (hcolor >> 0), 1, 0.5);
        color2.setHSL(hcolor - (hcolor >> 0) + 0.3, 1, 0.5);
      };

      // 更新发射器位置（轨道运动）
      const updateEmitter = (emitter, tha = 0) => {
        const p = 300 * Math.sin(2 * tha);

        emitter.position.x = p * Math.cos(tha);
        emitter.position.y = p * Math.sin(tha);
        emitter.position.z = (p * Math.tan(tha)) / 2;
      };

      // 更新相机位置（环绕运动）
      const updateCamera = (camera, scene, ctha = 0) => {
        const radius = 300;

        camera.lookAt(scene.position);

        camera.position.x = Math.sin(ctha) * radius;
        camera.position.z = Math.cos(ctha) * radius;
        camera.position.y = Math.sin(ctha) * radius;
      };

      // 创建发射器
      const createEmitter = (color1, color2) => {
        const emitter = new System.Emitter();

        return emitter
          .setRate(
            new System.Rate(new System.Span(4, 16), new System.Span(0.01))
          )
          .addInitializers([
            new System.Position(new System.PointZone(0, 0)),
            new System.Mass(1),
            new System.Radius(6, 12),
            new System.Life(3),
            new System.RadialVelocity(45, new System.Vector3D(0, 1, 0), 180),
          ])
          .addBehaviours([
            new System.Alpha(1, 0),
            new System.Scale(0.3, 0.6),
            new System.Color(color1, color2),
          ])
          .emit();
      };

      // 初始化粒子系统
      const particleSystem = new System.default();
      const color1 = new THREE.Color();
      const color2 = new THREE.Color();
      const emitter = createEmitter(color1, color2);

      particleSystem
        .addEmitter(emitter)
        .addRenderer(new System.SpriteRenderer(scene, THREE));

      // 动画循环
      const animate = () => {
        hcolor += 0.01;
        tha += Math.PI / 150;
        ctha += 0.016;

        updateColors(color1, color2, hcolor);
        updateEmitter(emitter, tha);
        updateCamera(camera, scene, ctha);

        // 更新粒子系统
        particleSystem.update();

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };

      // 窗口调整
      window.addEventListener("resize", () => {
        sizes.width = window.innerWidth;
        sizes.height = window.innerHeight;

        camera.aspect = sizes.width / sizes.height;
        camera.updateProjectionMatrix();

        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      // 启动动画
      animate();

      console.log("✅ Three-Nebula 彩色粒子喷泉已启动");
    </script>
  </body>
</html>
