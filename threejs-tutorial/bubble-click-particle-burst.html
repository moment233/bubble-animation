<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>气泡点击粒子碎裂效果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      .info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        padding: 15px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="info">
      点击气泡触发局部粒子碎裂效果
      <br />
      Click bubble to trigger particle burst
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      // 场景设置
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 0, 5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      document.body.appendChild(renderer.domElement);

      // 气泡 Shader
      const bubbleVertexShader = `
        varying vec3 vNormal;
        varying vec3 vPosition;
        
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `;

      const bubbleFragmentShader = `
        uniform vec3 uCameraPos;
        uniform samplerCube envMap;
        
        varying vec3 vNormal;
        varying vec3 vPosition;
        
        const float PI = 3.14159265359;
        
        vec3 getThinFilmColor(float cosTheta, float thickness) {
          float opticalPath = 2.0 * 1.33 * thickness * cosTheta;
          
          float phaseR = (2.0 * PI * opticalPath) / 650.0;
          float phaseG = (2.0 * PI * opticalPath) / 550.0;
          float phaseB = (2.0 * PI * opticalPath) / 450.0;
          
          vec3 color;
          color.r = 0.5 + 0.5 * cos(phaseR);
          color.g = 0.5 + 0.5 * cos(phaseG);
          color.b = 0.5 + 0.5 * cos(phaseB);
          
          return color;
        }
        
        void main() {
          vec3 viewDirection = normalize(uCameraPos - vPosition);
          vec3 normal = normalize(vNormal);
          float NdotV = abs(dot(normal, viewDirection));
          
          float fresnel = pow(1.0 - NdotV, 2.0);
          float edgeMask = smoothstep(0.3, 0.8, fresnel);
          
          float thickness = 300.0 + vNormal.y * 200.0;
          vec3 iridescence = getThinFilmColor(NdotV, thickness);
          
          vec3 reflected = reflect(-viewDirection, normal);
          vec3 envColor = textureCube(envMap, reflected).rgb;
          
          vec3 edgeColor = iridescence * 1.5 + envColor * fresnel * 0.3;
          vec3 centerColor = vec3(0.0);
          vec3 finalColor = mix(centerColor, edgeColor, edgeMask);
          
          float alpha = edgeMask * 0.95 + (1.0 - edgeMask) * 0.1;
          
          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      // 创建气泡（不使用 HDR）
      let bubble;
      const bubbleRadius = 1.5;

      // 创建简单的环境贴图
      const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256);
      const cubeCamera = new THREE.CubeCamera(0.1, 10, cubeRenderTarget);

      // 添加简单的环境光
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x1a1a2e);
      const envLight = new THREE.AmbientLight(0xffffff, 1);
      envScene.add(envLight);

      const geometry = new THREE.SphereGeometry(bubbleRadius, 128, 128);
      const material = new THREE.ShaderMaterial({
        vertexShader: bubbleVertexShader,
        fragmentShader: bubbleFragmentShader,
        uniforms: {
          uCameraPos: { value: camera.position },
          envMap: { value: cubeRenderTarget.texture },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      bubble = new THREE.Mesh(geometry, material);
      scene.add(bubble);

      console.log("✅ 气泡创建成功");

      // 粒子系统
      const particleSystems = [];

      // 采样气泡表面点
      function sampleBubbleSurface(geometry, density = 5) {
        const positions = geometry.attributes.position;
        const points = [];

        for (let i = 0; i < positions.count; i += density) {
          const vertex = new THREE.Vector3(
            positions.getX(i),
            positions.getY(i),
            positions.getZ(i)
          );
          points.push(vertex);
        }

        return points;
      }

      // 整个气泡瓦解成粒子（波纹扩散）
      function disintegrateBubble(clickPoint) {
        if (!bubble) return;

        // 采样气泡表面
        const surfacePoints = sampleBubbleSurface(bubble.geometry, 5);

        console.log(`💥 开始瓦解气泡，采样点数: ${surfacePoints.length}`);

        // 为每个表面点创建粒子
        surfacePoints.forEach((point, index) => {
          // 计算世界坐标
          const worldPoint = point.clone().applyMatrix4(bubble.matrixWorld);

          // 计算到点击位置的距离
          const distance = worldPoint.distanceTo(clickPoint);

          // 根据距离计算延迟（波纹扩散效果）
          const delay = distance * 100; // 调整这个值控制扩散速度

          setTimeout(() => {
            // 计算粒子飞散方向（从球心指向表面点）
            const direction = worldPoint.clone().normalize();

            // 添加随机偏移
            direction.x += (Math.random() - 0.5) * 0.3;
            direction.y += (Math.random() - 0.5) * 0.3;
            direction.z += (Math.random() - 0.5) * 0.3;
            direction.normalize();

            // 粒子速度
            const speed = 0.015 + Math.random() * 0.025;
            const velocity = direction.multiplyScalar(speed);

            // 创建粒子
            const particleGeometry = new THREE.SphereGeometry(0.01, 6, 6);
            const particleMaterial = new THREE.MeshBasicMaterial({
              color: 0xffffff,
              transparent: true,
              opacity: 1.0,
            });

            const particleMesh = new THREE.Mesh(
              particleGeometry,
              particleMaterial
            );
            particleMesh.position.copy(worldPoint);
            scene.add(particleMesh);

            // 存储粒子信息
            particleSystems.push({
              mesh: particleMesh,
              velocity: velocity,
              life: 1.0,
              decay: 0.01 + Math.random() * 0.008,
            });
          }, delay);
        });

        // 气泡快速淡出动画
        const fadeOutDuration = 300; // 300ms 快速消失
        const startTime = performance.now();
        const originalOpacity = bubble.material.opacity || 1;

        function fadeBubble() {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / fadeOutDuration, 1);

          if (bubble) {
            bubble.material.opacity = originalOpacity * (1 - progress);
          }

          if (progress < 1) {
            requestAnimationFrame(fadeBubble);
          } else {
            // 完全隐藏气泡
            if (bubble) {
              bubble.visible = false;

              // 3秒后重新显示气泡
              setTimeout(() => {
                if (bubble) {
                  bubble.visible = true;
                  bubble.material.opacity = originalOpacity;
                }
              }, 3000);
            }
          }
        }

        fadeBubble();
      }

      // 更新粒子
      function updateParticles() {
        for (let i = particleSystems.length - 1; i >= 0; i--) {
          const particle = particleSystems[i];

          // 更新位置
          particle.mesh.position.add(particle.velocity);

          // 添加重力
          particle.velocity.y -= 0.0008;

          // 更新生命周期
          particle.life -= particle.decay;

          // 更新透明度和缩放
          if (particle.life > 0) {
            particle.mesh.material.opacity = particle.life;
            const scale = 0.5 + particle.life * 0.5;
            particle.mesh.scale.setScalar(scale);
          } else {
            // 粒子死亡，移除
            scene.remove(particle.mesh);
            particle.mesh.geometry.dispose();
            particle.mesh.material.dispose();
            particleSystems.splice(i, 1);
          }
        }
      }

      // 鼠标点击检测
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener("click", (event) => {
        if (!bubble || !bubble.visible) return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(bubble);

        if (intersects.length > 0) {
          const clickPoint = intersects[0].point;

          disintegrateBubble(clickPoint);

          console.log("🎯 点击气泡位置:", clickPoint);
        }
      });

      // 窗口调整
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      // 动画循环
      function animate() {
        requestAnimationFrame(animate);

        // 气泡旋转
        if (bubble) {
          bubble.rotation.y += 0.002;
        }

        // 更新粒子
        updateParticles();

        renderer.render(scene, camera);
      }

      animate();
      console.log("✅ 气泡粒子碎裂系统启动");
    </script>
  </body>
</html>
