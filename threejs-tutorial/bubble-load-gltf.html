<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Load GLTF Model as Bubble</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 18px;
        z-index: 10;
        text-align: center;
      }

      #loading.hidden {
        display: none;
      }

      #info {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 13px;
        z-index: 10;
        line-height: 1.8;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        max-width: 400px;
      }

      #controls {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        color: #fff;
        font-size: 13px;
        z-index: 10;
        max-width: 300px;
      }

      .model-selector {
        margin-bottom: 20px;
      }

      .model-selector button {
        width: 100%;
        padding: 8px;
        margin: 5px 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.3s;
      }

      .model-selector button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .model-selector button.active {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      }

      .control-group {
        margin-bottom: 12px;
      }

      .control-group label {
        display: block;
        margin-bottom: 5px;
        color: #00d9ff;
        font-size: 12px;
      }

      .control-group input[type="range"] {
        width: 100%;
      }

      .control-group span {
        margin-left: 10px;
        color: #a855f7;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div>Loading model...</div>
      <div style="font-size: 12px; margin-top: 10px; color: #aaa">
        请稍候...
      </div>
    </div>

    <div id="info">
      🫧
      <strong>加载GLTF模型并应用气泡材质</strong>
      <br />
      📦 演示如何使用美术提供的.glb/.gltf模型
      <br />
      🎨 模型来源：Three.js官方示例
      <br />
      💡 可替换为任何自定义.glb模型
    </div>

    <div id="controls">
      <h3 style="margin-bottom: 15px; color: #00d9ff; font-size: 16px">
        模型选择
      </h3>

      <div class="model-selector">
        <button id="model1" class="active">🌍 Duck（鸭子）</button>
        <button id="model2">🎯 Avocado（牛油果）</button>
        <button id="model3">💎 Diamond（钻石）</button>
        <button id="model4">⚽ Sphere（球体）</button>
      </div>

      <h3 style="margin: 20px 0 15px 0; color: #00d9ff; font-size: 16px">
        材质控制
      </h3>

      <div class="control-group">
        <label>薄膜厚度 (Thickness)</label>
        <input
          type="range"
          id="thickness"
          min="200"
          max="800"
          step="10"
          value="400"
        />
        <span id="thicknessValue">400</span>
      </div>

      <div class="control-group">
        <label>动画速度 (Speed)</label>
        <input type="range" id="speed" min="0" max="2" step="0.1" value="0.5" />
        <span id="speedValue">0.5</span>
      </div>

      <div class="control-group">
        <label>模型缩放 (Scale)</label>
        <input
          type="range"
          id="scale"
          min="0.5"
          max="3"
          step="0.1"
          value="1.5"
        />
        <span id="scaleValue">1.5</span>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

      // ========== Bubble Shader ==========
      const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vWorldPosition;

        void main() {
          vNormal = normalize(normalMatrix * normal);
          vPosition = position;
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `;

      const fragmentShader = `
        uniform vec3 uCameraPos;
        uniform samplerCube envMap;
        uniform float uTime;
        uniform float uThickness;
        
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec3 vWorldPosition;

        const float PI = 3.14159265359;

        vec3 getThinFilmColor(float cosTheta, float thickness) {
          const float n = 1.33;
          float opticalPath = 2.0 * n * thickness * cosTheta;
          
          float phaseR = (2.0 * PI * opticalPath) / 650.0;
          float phaseO = (2.0 * PI * opticalPath) / 610.0;
          float phaseY = (2.0 * PI * opticalPath) / 580.0;
          float phaseG = (2.0 * PI * opticalPath) / 550.0;
          float phaseC = (2.0 * PI * opticalPath) / 490.0;
          float phaseB = (2.0 * PI * opticalPath) / 450.0;
          float phaseV = (2.0 * PI * opticalPath) / 420.0;
          
          float intensityR = pow(0.5 + 0.5 * cos(phaseR), 1.3);
          float intensityO = pow(0.5 + 0.5 * cos(phaseO), 1.3);
          float intensityY = pow(0.5 + 0.5 * cos(phaseY), 1.3);
          float intensityG = pow(0.5 + 0.5 * cos(phaseG), 1.3);
          float intensityC = pow(0.5 + 0.5 * cos(phaseC), 1.3);
          float intensityB = pow(0.5 + 0.5 * cos(phaseB), 1.3);
          float intensityV = pow(0.5 + 0.5 * cos(phaseV), 1.3);
          
          vec3 color = vec3(0.0);
          color.r = intensityR * 1.0 + intensityO * 0.9 + intensityY * 0.6;
          color.g = intensityY * 0.7 + intensityG * 1.0 + intensityC * 0.8;
          color.b = intensityC * 0.7 + intensityB * 1.0 + intensityV * 0.9;
          
          float maxComponent = max(max(color.r, color.g), color.b);
          if (maxComponent > 0.01) {
            color = color / maxComponent;
          }
          
          return color;
        }

        void main() {
          vec3 viewDirection = normalize(uCameraPos - vWorldPosition);
          vec3 normal = normalize(vNormal);
          float NdotV = abs(dot(normal, viewDirection));
          
          float fresnel = pow(1.0 - NdotV, 1.8);
          
          float thickness = uThickness + vPosition.y * 200.0 + 
                           sin(vPosition.x * 3.0 + uTime) * 50.0 +
                           cos(vPosition.z * 2.5 - uTime * 0.8) * 40.0;
          thickness = clamp(thickness, 200.0, 700.0);
          
          vec3 iridescence = getThinFilmColor(NdotV, thickness);
          float luminance = dot(iridescence, vec3(0.299, 0.587, 0.114));
          iridescence = mix(vec3(luminance), iridescence, 2.0);
          iridescence *= 2.5;
          
          vec3 reflected = reflect(-viewDirection, normal);
          vec3 envColor = textureCube(envMap, reflected).rgb;
          
          vec3 refracted = refract(-viewDirection, normal, 1.0 / 1.33);
          vec3 refractColor = vec3(0.0);
          if (length(refracted) > 0.01) {
            refractColor = textureCube(envMap, refracted).rgb;
          }
          
          float edgeMask = smoothstep(0.15, 0.95, fresnel);
          
          vec3 edgeColor = mix(iridescence, envColor, fresnel * 0.2);
          vec3 centerColor = refractColor * 1.5 + iridescence * 0.3 + envColor * 0.1;
          vec3 finalColor = mix(centerColor, edgeColor, edgeMask);
          
          finalColor *= 1.8;
          finalColor += envColor * 0.15;
          
          float alpha = edgeMask * 0.95 + (1.0 - edgeMask) * 0.25;
          
          gl_FragColor = vec4(finalColor, alpha);
        }
      `;

      // ========== Scene Setup ==========
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 1, 5);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // ========== 可用的在线模型（Three.js官方示例）==========
      const modelUrls = {
        model1: "https://threejs.org/examples/models/gltf/Duck/glTF/Duck.gltf",
        model2: "https://threejs.org/examples/models/gltf/Avocado.glb",
        model3:
          "https://threejs.org/examples/models/gltf/MaterialsVariantsShoe/glTF/MaterialsVariantsShoe.gltf",
        model4:
          "https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf",
      };

      let currentModel = null;
      let bubbleMaterial = null;
      let envMap = null;
      let animSpeed = 0.5;
      let modelScale = 1.5;

      // 创建气泡材质
      function createBubbleMaterial() {
        return new THREE.ShaderMaterial({
          vertexShader: vertexShader,
          fragmentShader: fragmentShader,
          uniforms: {
            uCameraPos: { value: camera.position },
            envMap: { value: envMap },
            uTime: { value: 0 },
            uThickness: { value: 400 },
          },
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
      }

      // ========== 加载GLTF模型 ==========
      const gltfLoader = new GLTFLoader();
      const loadingDiv = document.getElementById("loading");

      function loadModel(url, buttonId) {
        // 移除旧模型
        if (currentModel) {
          scene.remove(currentModel);
        }

        loadingDiv.classList.remove("hidden");
        loadingDiv.querySelector("div:first-child").textContent =
          "Loading model...";

        gltfLoader.load(
          url,
          (gltf) => {
            currentModel = gltf.scene;

            // 应用气泡材质到所有mesh
            currentModel.traverse((child) => {
              if (child.isMesh) {
                // 保存原始几何体信息
                const originalGeometry = child.geometry;

                // 创建新的气泡材质
                child.material = createBubbleMaterial();

                // 确保法线正确
                if (!originalGeometry.attributes.normal) {
                  originalGeometry.computeVertexNormals();
                }
              }
            });

            // 设置模型位置和缩放
            currentModel.position.set(0, 0, 0);
            currentModel.scale.setScalar(modelScale);

            scene.add(currentModel);
            loadingDiv.classList.add("hidden");

            // 更新按钮状态
            document
              .querySelectorAll(".model-selector button")
              .forEach((btn) => {
                btn.classList.remove("active");
              });
            document.getElementById(buttonId).classList.add("active");

            console.log(`✅ 模型加载成功: ${url}`);
            console.log("模型信息:", gltf);
          },
          (progress) => {
            const percent = (progress.loaded / progress.total) * 100;
            loadingDiv.querySelector(
              "div:last-child"
            ).textContent = `加载中... ${percent.toFixed(0)}%`;
          },
          (error) => {
            console.error("❌ 模型加载失败:", error);
            loadingDiv.querySelector("div:first-child").textContent =
              "模型加载失败，请检查网络";
          }
        );
      }

      // ========== 模型选择按钮 ==========
      document.getElementById("model1").addEventListener("click", () => {
        loadModel(modelUrls.model1, "model1");
      });

      document.getElementById("model2").addEventListener("click", () => {
        loadModel(modelUrls.model2, "model2");
      });

      document.getElementById("model3").addEventListener("click", () => {
        loadModel(modelUrls.model3, "model3");
      });

      document.getElementById("model4").addEventListener("click", () => {
        loadModel(modelUrls.model4, "model4");
      });

      // 默认加载第一个模型
      loadModel(modelUrls.model1, "model1");

      // ========== 控制面板 ==========
      const thicknessSlider = document.getElementById("thickness");
      const thicknessValue = document.getElementById("thicknessValue");
      const speedSlider = document.getElementById("speed");
      const speedValue = document.getElementById("speedValue");
      const scaleSlider = document.getElementById("scale");
      const scaleValue = document.getElementById("scaleValue");

      thicknessSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        thicknessValue.textContent = val;

        if (currentModel) {
          currentModel.traverse((child) => {
            if (child.isMesh && child.material.uniforms) {
              child.material.uniforms.uThickness.value = val;
            }
          });
        }
      });

      speedSlider.addEventListener("input", (e) => {
        animSpeed = parseFloat(e.target.value);
        speedValue.textContent = animSpeed.toFixed(1);
      });

      scaleSlider.addEventListener("input", (e) => {
        modelScale = parseFloat(e.target.value);
        scaleValue.textContent = modelScale.toFixed(1);

        if (currentModel) {
          currentModel.scale.setScalar(modelScale);
        }
      });

      // ========== Load HDR Environment ==========
      const rgbeLoader = new RGBELoader();

      rgbeLoader.load(
        "./studio_small_08_1k.hdr",
        (texture) => {
          const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512);
          cubeRenderTarget.fromEquirectangularTexture(renderer, texture);

          envMap = cubeRenderTarget.texture;

          // 更新所有材质的环境贴图
          if (currentModel) {
            currentModel.traverse((child) => {
              if (child.isMesh && child.material.uniforms) {
                child.material.uniforms.envMap.value = envMap;
              }
            });
          }

          texture.dispose();
          console.log("✅ Environment map loaded!");
        },
        undefined,
        (error) => {
          console.error("❌ HDR loading failed:", error);
        }
      );

      // ========== Animation Loop ==========
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const elapsedTime = clock.getElapsedTime();

        // 旋转模型
        if (currentModel) {
          currentModel.rotation.y = elapsedTime * 0.3;

          // 更新所有材质的时间uniform
          currentModel.traverse((child) => {
            if (child.isMesh && child.material.uniforms) {
              child.material.uniforms.uTime.value = elapsedTime * animSpeed;
              child.material.uniforms.uCameraPos.value.copy(camera.position);
            }
          });
        }

        renderer.render(scene, camera);
      }

      animate();

      // ========== Mouse Control ==========
      let mouseX = 0;
      let mouseY = 0;

      document.addEventListener("mousemove", (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;

        camera.position.x += (mouseX * 3 - camera.position.x) * 0.05;
        camera.position.y += (mouseY * 3 + 1 - camera.position.y) * 0.05;
        camera.lookAt(scene.position);
      });

      // ========== Window Resize ==========
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      // ========== Console Info ==========
      console.log(
        "%c🫧 GLTF Bubble Loader",
        "color: #00d9ff; font-size: 20px; font-weight: bold;"
      );
      console.log(
        "%c📦 演示如何加载.glb/.gltf模型并应用气泡材质",
        "color: #a855f7; font-size: 14px;"
      );
      console.log(
        "%c💡 可以替换为任何自定义模型URL",
        "color: #10b981; font-size: 14px;"
      );
    </script>
  </body>
</html>
