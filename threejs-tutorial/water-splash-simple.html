<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>纯Three.js 水滴飞溅效果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }
      .info {
        position: fixed;
        top: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.6);
        padding: 15px 20px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.8;
        z-index: 10;
        backdrop-filter: blur(10px);
      }
      .info h3 {
        margin: 0 0 10px 0;
        font-size: 18px;
        color: #4fc3f7;
      }
      .info p {
        margin: 5px 0;
      }
      .info .highlight {
        color: #ffd700;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>

    <div class="info">
      <h3>💧 纯Three.js 水滴飞溅效果</h3>
      <p>
        ✨
        <span class="highlight">点击任意位置</span>
        生成水滴飞溅
      </p>
      <p>🎯 瞬间爆发 + 重力效果 + 360度发射</p>
      <p>💦 真实的水滴物理模拟</p>
      <p style="color: #aaa; font-size: 12px; margin-top: 10px">
        ⚡ 无需额外库，纯Three.js实现
      </p>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      const canvas = document.querySelector("#webgl");

      // 场景设置
      const scene = new THREE.Scene();

      const sizes = {
        width: window.innerWidth,
        height: window.innerHeight,
      };

      // 相机
      const camera = new THREE.PerspectiveCamera(
        75,
        sizes.width / sizes.height,
        0.1,
        1000
      );
      camera.position.set(0, 5, 30);
      camera.lookAt(0, 0, 0);

      // 渲染器
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
      });
      renderer.setSize(sizes.width, sizes.height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // 添加地面参考
      const groundGeometry = new THREE.PlaneGeometry(100, 100);
      const groundMaterial = new THREE.MeshBasicMaterial({
        color: 0x333333,
        transparent: true,
        opacity: 0.3,
      });
      const ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -5;
      scene.add(ground);

      // 添加网格辅助
      const gridHelper = new THREE.GridHelper(100, 50, 0x666666, 0x444444);
      gridHelper.position.y = -4.9;
      scene.add(gridHelper);

      // 粒子系统数组
      const particleSystems = [];

      // 水滴类
      class Droplet {
        constructor(x, y, z) {
          // 随机大小
          const size = 0.2 + Math.random() * 0.3;
          this.geometry = new THREE.SphereGeometry(size, 8, 8);

          // 水滴材质
          this.material = new THREE.MeshBasicMaterial({
            color: new THREE.Color().setHSL(0.55, 0.8, 0.6),
            transparent: true,
            opacity: 0.8,
          });

          this.mesh = new THREE.Mesh(this.geometry, this.material);
          this.mesh.position.set(x, y, z);

          // ⚡ 关键1: 360度全方位发射
          const theta = Math.random() * Math.PI * 2; // 水平角度
          const phi = Math.random() * Math.PI; // 垂直角度

          // ⚡ 关键2: 高速度（15-25）
          const speed = 15 + Math.random() * 10;

          this.velocity = new THREE.Vector3(
            Math.sin(phi) * Math.cos(theta) * speed,
            Math.cos(phi) * speed * 0.8, // 主要向上
            Math.sin(phi) * Math.sin(theta) * speed
          );

          // ⚡ 关键3: 重力加速度
          this.gravity = new THREE.Vector3(0, -9.8, 0);

          // 生命周期
          this.life = 1.0;
          this.decay = 0.01 + Math.random() * 0.01;

          // 旋转速度
          this.rotationSpeed = new THREE.Vector3(
            (Math.random() - 0.5) * 0.2,
            (Math.random() - 0.5) * 0.2,
            (Math.random() - 0.5) * 0.2
          );
        }

        update(deltaTime) {
          // 应用重力
          this.velocity.add(this.gravity.clone().multiplyScalar(deltaTime));

          // 更新位置
          this.mesh.position.add(
            this.velocity.clone().multiplyScalar(deltaTime)
          );

          // 旋转
          this.mesh.rotation.x += this.rotationSpeed.x;
          this.mesh.rotation.y += this.rotationSpeed.y;
          this.mesh.rotation.z += this.rotationSpeed.z;

          // 生命周期衰减
          this.life -= this.decay;

          // 更新透明度和大小
          this.material.opacity = this.life * 0.8;
          const scale = 0.5 + this.life * 0.5;
          this.mesh.scale.setScalar(scale);

          return this.life > 0;
        }

        dispose() {
          this.geometry.dispose();
          this.material.dispose();
        }
      }

      // 水滴飞溅系统
      class WaterSplash {
        constructor(x, y, z) {
          this.droplets = [];

          // ⚡ 关键1: 瞬间爆发（创建30-50个水滴）
          const count = 30 + Math.floor(Math.random() * 20);

          for (let i = 0; i < count; i++) {
            const droplet = new Droplet(x, y, z);
            this.droplets.push(droplet);
            scene.add(droplet.mesh);
          }
        }

        update(deltaTime) {
          // 更新所有水滴
          for (let i = this.droplets.length - 1; i >= 0; i--) {
            const droplet = this.droplets[i];
            const alive = droplet.update(deltaTime);

            if (!alive) {
              // 移除死亡的水滴
              scene.remove(droplet.mesh);
              droplet.dispose();
              this.droplets.splice(i, 1);
            }
          }

          // 如果所有水滴都死亡，返回false
          return this.droplets.length > 0;
        }
      }

      // 创建水滴飞溅
      function createWaterSplash(x, y, z) {
        const splash = new WaterSplash(x, y, z);
        particleSystems.push(splash);
        console.log(
          `💦 创建水滴飞溅 at (${x.toFixed(1)}, ${y.toFixed(1)}, ${z.toFixed(
            1
          )})`
        );
      }

      // 鼠标点击事件
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      canvas.addEventListener("click", (event) => {
        // 计算鼠标位置
        mouse.x = (event.clientX / sizes.width) * 2 - 1;
        mouse.y = -(event.clientY / sizes.height) * 2 + 1;

        // 使用射线检测
        raycaster.setFromCamera(mouse, camera);

        // 在3D空间中创建一个点
        const intersectPoint = new THREE.Vector3();
        raycaster.ray.at(20, intersectPoint);

        // 生成水滴飞溅
        createWaterSplash(intersectPoint.x, intersectPoint.y, intersectPoint.z);
      });

      // 自动演示：定期生成水滴
      setInterval(() => {
        const randomX = (Math.random() - 0.5) * 20;
        const randomY = (Math.random() - 0.5) * 10;
        const randomZ = (Math.random() - 0.5) * 10;

        createWaterSplash(randomX, randomY, randomZ);
      }, 2000);

      // 窗口调整
      window.addEventListener("resize", () => {
        sizes.width = window.innerWidth;
        sizes.height = window.innerHeight;

        camera.aspect = sizes.width / sizes.height;
        camera.updateProjectionMatrix();

        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      // 动画循环
      const clock = new THREE.Clock();

      const tick = () => {
        const deltaTime = clock.getDelta();

        // 更新所有粒子系统
        for (let i = particleSystems.length - 1; i >= 0; i--) {
          const system = particleSystems[i];
          const alive = system.update(deltaTime);

          if (!alive) {
            particleSystems.splice(i, 1);
          }
        }

        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      };

      tick();

      console.log("✅ 纯Three.js水滴飞溅系统已启动");
      console.log("💡 点击屏幕任意位置生成水滴飞溅效果");
    </script>
  </body>
</html>
