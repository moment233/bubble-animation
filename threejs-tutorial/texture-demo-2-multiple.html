<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo 2: 多种纹理类型 - 材质的多层控制</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      .info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 10px;
        max-width: 450px;
        backdrop-filter: blur(10px);
      }
      .info h1 {
        font-size: 24px;
        margin-bottom: 10px;
        color: #00d9ff;
      }
      .info h2 {
        font-size: 18px;
        margin: 15px 0 10px;
        color: #ffa500;
      }
      .info p {
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      .info code {
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 3px;
        color: #00ff88;
      }
    </style>
  </head>
  <body>
    <div class="info">
      <h1>🎨 Demo 2: 多种纹理类型</h1>
      <p>
        <strong>核心概念：</strong>
        一个材质可以使用多张纹理，分别控制不同的视觉属性。
      </p>

      <h2>纹理类型</h2>
      <p>
        🎨
        <code>map</code>
        - 基础颜色纹理（物体的颜色）
      </p>
      <p>
        ✨
        <code>roughnessMap</code>
        - 粗糙度纹理（表面光滑程度）
      </p>
      <p>
        🔩
        <code>metalnessMap</code>
        - 金属度纹理（金属 vs 非金属）
      </p>

      <h2>材质属性</h2>
      <p>
        📦
        <code>MeshStandardMaterial</code>
        - PBR 物理材质（基于物理的渲染）
      </p>
      <p>💡 需要灯光才能看到效果（与 MeshBasicMaterial 不同）</p>

      <h2>效果展示</h2>
      <p>
        同一张 HDR 图片被用作 3
        种不同的纹理，叠加出复杂的表面质感。左侧亮部更光滑，右侧暗部更粗糙。
      </p>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

      // ========== Three.js 基础设置 ==========
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 5;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // ========== 添加灯光（PBR 材质需要光照） ==========
      const light1 = new THREE.DirectionalLight(0xffffff, 1.5);
      light1.position.set(5, 5, 5);
      scene.add(light1);

      const light2 = new THREE.DirectionalLight(0xffffff, 0.8);
      light2.position.set(-5, -3, -5);
      scene.add(light2);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambientLight);

      // ========== 核心：多纹理材质 ==========

      // 1. 创建球体几何体
      const geometry = new THREE.SphereGeometry(1.5, 128, 128);

      // 2. 加载纹理
      const rgbeLoader = new RGBELoader();
      rgbeLoader.load("./abc2.hdr", (texture) => {
        // 3. 创建 PBR 材质，使用多个纹理通道
        const material = new THREE.MeshStandardMaterial({
          // 🎨 颜色纹理：定义物体的基础颜色
          map: texture,

          // ✨ 粗糙度纹理：控制表面光滑程度
          // 亮区 = 光滑（强反射），暗区 = 粗糙（散射）
          roughnessMap: texture,
          roughness: 0.5, // 整体粗糙度系数

          // 🔩 金属度纹理：控制金属质感
          // 亮区 = 金属，暗区 = 非金属
          metalnessMap: texture,
          metalness: 0.8, // 整体金属度系数
        });

        // 4. 创建网格
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // 5. 动画循环
        function animate() {
          requestAnimationFrame(animate);

          // 慢速旋转，展示不同区域的材质差异
          sphere.rotation.y += 0.005;
          sphere.rotation.x += 0.003;

          renderer.render(scene, camera);
        }
        animate();

        console.log("✅ Demo 2: 多纹理材质加载成功！");
        console.log("📝 同一张图片作为 3 种不同用途的纹理：");
        console.log("   - map: 控制颜色");
        console.log("   - roughnessMap: 控制粗糙度");
        console.log("   - metalnessMap: 控制金属度");
      });

      // 窗口大小调整
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });
    </script>
  </body>
</html>
