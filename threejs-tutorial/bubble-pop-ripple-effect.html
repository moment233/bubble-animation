<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>气泡戳破效果 - 波纹扩散</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      .info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="info">
      点击球体触发戳破效果
      <br />
      粒子从点击位置波纹状扩散
      <br />
      Click sphere to pop
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      // 场景设置
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0a);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 0, 5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // 灯光
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(5, 5, 5);
      scene.add(directionalLight);

      // 创建物理材质球体
      let sphere;
      const sphereRadius = 1.5;

      const geometry = new THREE.SphereGeometry(sphereRadius, 128, 128);
      const material = new THREE.MeshPhysicalMaterial({
        color: 0x4fc3f7,
        metalness: 0.1,
        roughness: 0.1,
        transmission: 0.9,
        thickness: 0.5,
        transparent: true,
        opacity: 1,
      });

      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);

      // 粒子系统
      const particleSystems = [];

      // 采样球体表面点
      function sampleSphereSurface(geometry, density = 3) {
        const positions = geometry.attributes.position;
        const points = [];

        for (let i = 0; i < positions.count; i += density) {
          const vertex = new THREE.Vector3(
            positions.getX(i),
            positions.getY(i),
            positions.getZ(i)
          );
          points.push(vertex);
        }

        return points;
      }

      // 戳破效果：波纹扩散粒子
      function popSphere(clickPoint) {
        if (!sphere || !sphere.visible) return;

        // 采样球体表面（更密集）
        const surfacePoints = sampleSphereSurface(sphere.geometry, 3);

        console.log(`💥 戳破球体，采样点数: ${surfacePoints.length}`);

        // 计算所有点到点击位置的距离
        const pointsWithDistance = surfacePoints.map((point) => {
          const worldPoint = point.clone().applyMatrix4(sphere.matrixWorld);
          const distance = worldPoint.distanceTo(clickPoint);
          return { point: worldPoint, distance };
        });

        // 按距离排序
        pointsWithDistance.sort((a, b) => a.distance - b.distance);

        // 找出最大距离（球体直径）
        const maxDistance = Math.max(
          ...pointsWithDistance.map((p) => p.distance)
        );

        // 分波次生成粒子（模拟破裂波）- 更快更密集
        const waveCount = 20; // 波的数量（增加）
        const waveInterval = 12; // 每波间隔时间（ms）- 更快

        for (let wave = 0; wave < waveCount; wave++) {
          setTimeout(() => {
            // 计算当前波的距离范围
            const waveProgress = wave / waveCount;
            const nextWaveProgress = (wave + 1) / waveCount;

            const minDist = waveProgress * maxDistance;
            const maxDist = nextWaveProgress * maxDistance;

            // 筛选出当前波范围内的点
            const wavePoints = pointsWithDistance.filter(
              (p) => p.distance >= minDist && p.distance < maxDist
            );

            // 为这一波的点创建粒子
            wavePoints.forEach((pointData) => {
              const worldPoint = pointData.point;

              // 计算粒子飞散方向（从球心指向表面点）
              const direction = worldPoint.clone().normalize();

              // 添加随机偏移
              direction.x += (Math.random() - 0.5) * 0.4;
              direction.y += (Math.random() - 0.5) * 0.4;
              direction.z += (Math.random() - 0.5) * 0.4;
              direction.normalize();

              // 粒子速度
              const speed = 0.02 + Math.random() * 0.03;
              const velocity = direction.multiplyScalar(speed);

              // 创建粒子
              const particleGeometry = new THREE.SphereGeometry(0.01, 6, 6);
              const particleMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 1.0,
              });

              const particleMesh = new THREE.Mesh(
                particleGeometry,
                particleMaterial
              );
              particleMesh.position.copy(worldPoint);
              scene.add(particleMesh);

              // 存储粒子信息
              particleSystems.push({
                mesh: particleMesh,
                velocity: velocity,
                life: 1.0,
                decay: 0.012 + Math.random() * 0.008,
              });
            });
          }, wave * waveInterval);
        }

        // 球体快速消失（跟随破裂波）
        const totalDuration = waveCount * waveInterval; // 总时长约 240ms
        const startTime = performance.now();

        function fadeSphere() {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / totalDuration, 1);

          if (sphere && sphere.material) {
            // 快速淡出
            sphere.material.opacity = 1 - progress;
          }

          if (progress < 1) {
            requestAnimationFrame(fadeSphere);
          } else {
            // 完全隐藏球体
            if (sphere) {
              sphere.visible = false;

              // 2秒后重新显示
              setTimeout(() => {
                if (sphere) {
                  sphere.visible = true;
                  sphere.material.opacity = 1;
                }
              }, 2000);
            }
          }
        }

        fadeSphere();
      }

      // 更新粒子
      function updateParticles() {
        for (let i = particleSystems.length - 1; i >= 0; i--) {
          const particle = particleSystems[i];

          // 更新位置
          particle.mesh.position.add(particle.velocity);

          // 添加重力
          particle.velocity.y -= 0.0008;

          // 更新生命周期
          particle.life -= particle.decay;

          // 更新透明度和缩放
          if (particle.life > 0) {
            particle.mesh.material.opacity = particle.life;
            const scale = 0.5 + particle.life * 0.5;
            particle.mesh.scale.setScalar(scale);
          } else {
            // 粒子死亡，移除
            scene.remove(particle.mesh);
            particle.mesh.geometry.dispose();
            particle.mesh.material.dispose();
            particleSystems.splice(i, 1);
          }
        }
      }

      // 鼠标点击检测
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener("click", (event) => {
        if (!sphere || !sphere.visible) return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(sphere);

        if (intersects.length > 0) {
          const clickPoint = intersects[0].point;
          popSphere(clickPoint);
          console.log("🎯 点击位置:", clickPoint);
        }
      });

      // 窗口调整
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      // 动画循环
      function animate() {
        requestAnimationFrame(animate);

        // 球体旋转
        if (sphere && sphere.visible) {
          sphere.rotation.y += 0.005;
        }

        // 更新粒子
        updateParticles();

        renderer.render(scene, camera);
      }

      animate();
      console.log("✅ 气泡戳破效果启动");
    </script>
  </body>
</html>
