<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle Burst Effect - 粒子爆裂效果</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        padding: 15px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="info">
      点击屏幕任意位置触发粒子爆裂效果
      <br />
      Click anywhere to trigger particle burst
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      let scene, camera, renderer;
      let particleSystems = [];

      function init() {
        // 场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // 相机
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.z = 5;

        // 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 鼠标点击事件
        window.addEventListener("click", onMouseClick);
        window.addEventListener("resize", onWindowResize);
      }

      function onMouseClick(event) {
        // 将鼠标坐标转换为Three.js世界坐标
        const mouse = new THREE.Vector2();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        // 创建射线
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);

        // 计算点击位置在z=0平面的交点
        const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const intersectPoint = new THREE.Vector3();
        raycaster.ray.intersectPlane(planeZ, intersectPoint);

        // 创建粒子爆裂
        createParticleBurst(intersectPoint);
      }

      function createParticleBurst(position) {
        const particleCount = 50; // 粒子数量
        const particles = [];

        for (let i = 0; i < particleCount; i++) {
          // 随机速度方向（360度随机方向）
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.015 + Math.random() * 0.025;
          const speedVariation = 0.5 + Math.random() * 0.5;

          const velocity = new THREE.Vector3(
            Math.cos(angle) * speed * speedVariation,
            Math.sin(angle) * speed * speedVariation,
            (Math.random() - 0.5) * speed * 0.3
          );

          // 创建粒子几何体 - 实体小球
          const particleGeometry = new THREE.SphereGeometry(0.01, 6, 6);
          const particleMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 1.0,
          });

          const particleMesh = new THREE.Mesh(
            particleGeometry,
            particleMaterial
          );
          particleMesh.position.copy(position);
          scene.add(particleMesh);

          // 存储粒子信息
          particles.push({
            mesh: particleMesh,
            velocity: velocity,
            life: 1.0,
            decay: 0.015 + Math.random() * 0.01,
          });
        }

        // 保存粒子数组
        particleSystems.push({
          particles: particles,
          createdAt: Date.now(),
        });
      }

      function updateParticles() {
        for (let i = particleSystems.length - 1; i >= 0; i--) {
          const system = particleSystems[i];
          let allDead = true;

          // 更新每个粒子
          for (let j = system.particles.length - 1; j >= 0; j--) {
            const particle = system.particles[j];

            // 更新位置
            particle.mesh.position.add(particle.velocity);

            // 添加重力
            particle.velocity.y -= 0.0008;

            // 更新生命周期
            particle.life -= particle.decay;

            // 更新透明度和缩放
            if (particle.life > 0) {
              allDead = false;
              particle.mesh.material.opacity = particle.life;
              const scale = 0.5 + particle.life * 0.5;
              particle.mesh.scale.setScalar(scale);
            } else {
              // 粒子死亡，移除
              scene.remove(particle.mesh);
              particle.mesh.geometry.dispose();
              particle.mesh.material.dispose();
              system.particles.splice(j, 1);
            }
          }

          // 如果所有粒子都死亡，移除整个系统
          if (allDead || system.particles.length === 0) {
            particleSystems.splice(i, 1);
          }
        }
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        updateParticles();
        renderer.render(scene, camera);
      }

      // 启动
      init();
      animate();
    </script>
  </body>
</html>
