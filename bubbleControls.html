<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>气泡参数设置器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }

      .controls {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        color: white;
        width: 320px;
        max-height: 90vh;
        overflow-y: auto;
        backdrop-filter: blur(10px);
      }

      .control-group {
        margin-bottom: 20px;
      }

      .control-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #aaa;
      }

      .control-group input[type="range"] {
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: #333;
        outline: none;
      }

      .control-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #8b5cf6;
        cursor: pointer;
      }

      .value-display {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 5px;
      }

      .value-display span {
        color: #8b5cf6;
        font-weight: 600;
      }

      h3 {
        margin-bottom: 20px;
        color: #8b5cf6;
        font-size: 18px;
      }

      .reset-btn {
        width: 100%;
        padding: 10px;
        background: #8b5cf6;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        margin-top: 10px;
      }

      .reset-btn:hover {
        background: #7c3aed;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>

    <div class="controls">
      <h3>🫧 气泡参数设置器</h3>

      <div class="control-group">
        <label>尺寸 (Size)</label>
        <input type="range" id="size" min="0.5" max="8" step="0.1" value="4" />
        <div class="value-display">
          <span id="sizeValue">4.0</span>
        </div>
      </div>

      <div class="control-group">
        <label>X轴缩放 (Scale X)</label>
        <input
          type="range"
          id="scaleX"
          min="0.5"
          max="3"
          step="0.05"
          value="1.2"
        />
        <div class="value-display">
          <span id="scaleXValue">1.20</span>
        </div>
      </div>

      <div class="control-group">
        <label>Y轴缩放 (Scale Y)</label>
        <input
          type="range"
          id="scaleY"
          min="0.5"
          max="3"
          step="0.05"
          value="0.85"
        />
        <div class="value-display">
          <span id="scaleYValue">0.85</span>
        </div>
      </div>

      <div class="control-group">
        <label>速度 (Speed)</label>
        <input type="range" id="speed" min="1" max="150" step="1" value="24" />
        <div class="value-display">
          <span id="speedValue">24</span>
        </div>
      </div>

      <div class="control-group">
        <label>细节密度 (Spikes)</label>
        <input
          type="range"
          id="spikes"
          min="0"
          max="2"
          step="0.01"
          value="0.26"
        />
        <div class="value-display">
          <span id="spikesValue">0.26</span>
        </div>
      </div>

      <div class="control-group">
        <label>形变幅度 (Processing)</label>
        <input
          type="range"
          id="processing"
          min="0"
          max="5"
          step="0.01"
          value="0.72"
        />
        <div class="value-display">
          <span id="processingValue">0.72</span>
        </div>
      </div>

      <div class="control-group">
        <label>X位置</label>
        <input
          type="range"
          id="posX"
          min="-30"
          max="30"
          step="0.5"
          value="-15"
        />
        <div class="value-display">
          <span id="posXValue">-15.0</span>
        </div>
      </div>

      <div class="control-group">
        <label>Y位置</label>
        <input
          type="range"
          id="posY"
          min="-20"
          max="25"
          step="0.5"
          value="12"
        />
        <div class="value-display">
          <span id="posYValue">12.0</span>
        </div>
      </div>

      <button class="reset-btn" id="reset">重置参数</button>
      <button
        class="reset-btn"
        id="copy"
        style="background: #059669; margin-top: 5px"
      >
        复制配置代码
      </button>
    </div>

    <script type="module" src="./bubbleControls.js"></script>
  </body>
</html>
