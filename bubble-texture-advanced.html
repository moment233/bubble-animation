<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高级气泡纹理：透明+图片</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: linear-gradient(to bottom, #1a1a1a, #000);
      }

      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }

      .info {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #fff;
        font-family: 'Arial', sans-serif;
        font-size: 13px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 12px;
        z-index: 100;
        max-width: 400px;
        line-height: 1.6;
      }

      .info h1 {
        font-size: 20px;
        margin-bottom: 15px;
        color: #4fc3f7;
      }

      .info h2 {
        font-size: 15px;
        margin-top: 12px;
        margin-bottom: 6px;
        color: #81c784;
      }

      .info p {
        margin: 3px 0;
        opacity: 0.9;
        font-size: 12px;
      }

      .comparison {
        margin-top: 15px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
      }

      .comparison-item {
        margin: 8px 0;
        padding-left: 10px;
        border-left: 3px solid #4fc3f7;
      }

      .upload-area {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 12px;
        color: #fff;
        z-index: 100;
        max-width: 280px;
      }

      .upload-btn {
        display: block;
        width: 100%;
        padding: 10px 20px;
        background: #4fc3f7;
        color: #000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        margin-top: 10px;
        transition: background 0.3s;
      }

      .upload-btn:hover {
        background: #81d4fa;
      }

      #fileInput {
        display: none;
      }

      .controls {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 15px;
        border-radius: 12px;
        color: #fff;
        z-index: 100;
        min-width: 300px;
      }

      .control-item {
        margin: 10px 0;
      }

      .control-item label {
        display: block;
        font-size: 12px;
        margin-bottom: 5px;
        color: #4fc3f7;
      }

      .control-item input[type="range"] {
        width: 100%;
      }

      .control-item input[type="checkbox"] {
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>

    <div class="info">
      <h1>🎨 高级气泡纹理方案对比</h1>
      
      <div class="comparison">
        <div class="comparison-item">
          <h2>左：纯图片纹理</h2>
          <p>❌ 不透明</p>
          <p>❌ 无折射</p>
          <p>✅ 显示图片</p>
        </div>
        
        <div class="comparison-item">
          <h2>中：纯物理材质</h2>
          <p>✅ 透明折射</p>
          <p>✅ 彩虹效果</p>
          <p>❌ 无法自定义图案</p>
        </div>
        
        <div class="comparison-item">
          <h2>右：混合方案 ⭐</h2>
          <p>✅ 透明折射</p>
          <p>✅ 彩虹效果</p>
          <p>✅ 显示图片纹理</p>
          <p style="color: #81c784;">💡 使用 emissiveMap 或 alphaMap</p>
        </div>
      </div>
      
      <p style="margin-top: 15px; color: #4fc3f7;">🖱️ 拖动鼠标旋转查看</p>
    </div>

    <div class="upload-area">
      <h2 style="margin: 0 0 10px 0; font-size: 16px;">上传纹理图片</h2>
      <p style="font-size: 12px; opacity: 0.8; margin-bottom: 10px;">
        支持 JPG, PNG, HDR
      </p>
      <input type="file" id="fileInput" accept="image/*,.hdr" />
      <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
        📁 选择图片
      </button>
      <p id="fileName" style="font-size: 12px; margin-top: 10px; opacity: 0.7;">
        未选择文件
      </p>
    </div>

    <div class="controls">
      <h3 style="margin: 0 0 15px 0; font-size: 14px; color: #4fc3f7;">混合球体控制</h3>
      
      <div class="control-item">
        <label>透明度 (Transmission): <span id="transmissionValue">0.95</span></label>
        <input type="range" id="transmission" min="0" max="1" step="0.01" value="0.95">
      </div>
      
      <div class="control-item">
        <label>彩虹强度 (Iridescence): <span id="iridescenceValue">1.0</span></label>
        <input type="range" id="iridescence" min="0" max="1" step="0.01" value="1.0">
      </div>
      
      <div class="control-item">
        <label>发光强度 (Emissive): <span id="emissiveValue">0.3</span></label>
        <input type="range" id="emissiveIntensity" min="0" max="2" step="0.1" value="0.3">
      </div>
      
      <div class="control-item">
        <label>
          <input type="checkbox" id="useEmissiveMap" checked>
          使用发光贴图（图片会"发光"）
        </label>
      </div>
    </div>

    <script type="module" src="/bubble-texture-advanced.js"></script>
  </body>
</html>
