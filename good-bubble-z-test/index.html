<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>气泡动画</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }

      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }

      .controls {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 20px;
        border-radius: 12px;
        color: white;
        width: 280px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(139, 92, 246, 0.3);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        z-index: 1000;
      }

      .controls h3 {
        margin: 0 0 20px 0;
        color: #8b5cf6;
        font-size: 18px;
        font-weight: 600;
        text-align: center;
      }

      .control-group {
        margin-bottom: 18px;
      }

      .control-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        color: #aaa;
        font-weight: 500;
      }

      .control-group input[type="range"] {
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: #333;
        outline: none;
        -webkit-appearance: none;
      }

      .control-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #8b5cf6;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .control-group input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }

      .control-group input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #8b5cf6;
        cursor: pointer;
        border: none;
      }

      .value-display {
        margin-top: 5px;
        text-align: right;
      }

      .value-display span {
        color: #8b5cf6;
        font-weight: 600;
        font-size: 14px;
      }

      .reset-btn {
        width: 100%;
        padding: 10px;
        background: #8b5cf6;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        margin-top: 10px;
        transition: background 0.2s;
      }

      .reset-btn:hover {
        background: #7c3aed;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>

    <div class="controls">
      <h3>📷 景深控制器</h3>

      <div class="control-group">
        <label>焦点距离 (Focus)</label>
        <input
          type="range"
          id="focus"
          min="15"
          max="45"
          step="0.5"
          value="30"
        />
        <div class="value-display">
          <span id="focusValue">30.0</span>
        </div>
      </div>

      <div class="control-group">
        <label>光圈大小 (Aperture)</label>
        <input
          type="range"
          id="aperture"
          min="0.00001"
          max="0.001"
          step="0.00001"
          value="0.00005"
        />
        <div class="value-display">
          <span id="apertureValue">0.00005</span>
        </div>
      </div>

      <div class="control-group">
        <label>最大模糊 (Max Blur)</label>
        <input
          type="range"
          id="maxBlur"
          min="0.001"
          max="0.05"
          step="0.001"
          value="0.01"
        />
        <div class="value-display">
          <span id="maxBlurValue">0.010</span>
        </div>
      </div>

      <button class="reset-btn" id="resetDOF">重置景深</button>
    </div>

    <script type="module" src="/bubbles.js"></script>
  </body>
</html>
