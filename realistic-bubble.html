<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>写实气泡效果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: #000;
      }

      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
      }

      .info {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #fff;
        font-family: monospace;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        padding: 15px;
        border-radius: 8px;
        z-index: 100;
      }

      .info h1 {
        font-size: 18px;
        margin-bottom: 10px;
      }

      .info p {
        margin: 5px 0;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>

    <div class="info">
      <h1>写实气泡效果</h1>
      <p>✨ 强烈的彩虹色边缘</p>
      <p>🔮 高度透明的中心</p>
      <p>💡 环境高光点</p>
      <p>🖱️ 拖动鼠标旋转视角</p>
    </div>

    <script type="module" src="/realistic-bubble.js"></script>
  </body>
</html>
